        function filterAvailablePorts() {
            const siteFilter = document.getElementById('siteFilterSelect').value;
            const typeFilter = document.getElementById('typeFilterSelect').value;
            const availFilter = document.getElementById('availabilityFilterSelect').value;
            
            // Get all tables (now multiple tables across sections)
            const rows = document.querySelectorAll('table tbody tr[data-site]');
            
            rows.forEach(row => {
                const rowSite = row.getAttribute('data-site');
                const rowType = row.getAttribute('data-type');
                const rowHasAvailable = row.getAttribute('data-has-available') === 'true';
                
                let show = true;
                
                if (siteFilter && rowSite !== siteFilter) show = false;
                if (typeFilter && rowType !== typeFilter) show = false;
                if (availFilter === 'available' && !rowHasAvailable) show = false;
                if (availFilter === 'full' && rowHasAvailable) show = false;
                
                row.style.display = show ? '' : 'none';
            });
        }

        // Navigation
        
        // Navigation History for Back Button
        let navigationHistory = [];
        let currentPage = 'dashboard';
        
        function updateBackButton() {
            const backBtn = document.getElementById('backButton');
            if (backBtn) {
                if (navigationHistory.length > 0) {
                    backBtn.style.display = 'flex';
                } else {
                    backBtn.style.display = 'none';
                }
            }
        }
        
        function goBack() {
            if (navigationHistory.length > 0) {
                const previousPage = navigationHistory.pop();
                currentPage = previousPage;
                
                // Update active nav item
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.remove('active');
                    const itemText = item.textContent.toLowerCase().trim();
                    if (itemText.includes(previousPage)) {
                        item.classList.add('active');
                    }
                });
                
                render(previousPage); // Render without adding to history
            }
        }
        
        // Programmatic navigation (dashboard cards, links) - syncs sidebar highlight
        function goToPage(page) {
            if (page !== currentPage) {
                navigationHistory.push(currentPage);
                currentPage = page;
            }
            document.querySelectorAll('.nav-item').forEach(item => {
                const oc = item.getAttribute('onclick') || '';
                item.classList.toggle('active', oc.includes("navigateTo('" + page + "')"));
            });
            render(page);
        }

        function navigateTo(page) {
            // Don't add to history if going to same page
            if (page !== currentPage) {
                navigationHistory.push(currentPage);
                currentPage = page;
            }
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            render(page);
        }

        // Render function (simplified for demo)
        async function render(page, skipHistory = false) {
            const content = document.getElementById('content');
            
            // Update back button visibility
            updateBackButton();
            
            if (page === 'dashboard') {
                try {
                    const [sites, racks, equipment, fdps, circuits, nnis, dfRoutes, dfSegments] = await Promise.all([
                        store.getSites(),
                        store.getRacks(),
                        store.getEquipment(),
                        store.getFdps(),
                        store.getCircuits(),
                        store.getNnis(),
                        store.getDarkFiberRoutes().catch(() => []),
                        store.getDarkFiberSegments().catch(() => [])
                    ]);
                    
                    // ===== Recent Activity (audit trail lite: who changed what, when) =====
                    const activity = [];
                    const collect = (items, type, icon, nameFn, clickFn) => items.forEach(i => {
                        if (!i._modified) return;
                        activity.push({ when: new Date(i._modified), type, icon, name: nameFn(i) || '(unnamed)', who: i._modifiedBy || '', isNew: i._created && (new Date(i._modified) - new Date(i._created) < 60000), click: clickFn(i) });
                    });
                    collect(sites, 'Site', '🏢', i => i.name, i => `showQuickActions('site','${i.id}')`);
                    collect(racks, 'Rack', '🗄️', i => i.name, i => `showQuickActions('rack','${i.id}')`);
                    collect(equipment, 'Equipment', '🖥️', i => i.name, i => `showQuickActions('equipment','${i.id}')`);
                    collect(fdps, 'FDP', '🔆', i => i.name, i => `showQuickActions('fdp','${i.id}')`);
                    collect(circuits, 'Circuit', '⚡', i => i.circuitId, i => `showQuickActions('circuit','${i.id}')`);
                    collect(nnis, 'NNI', '🔗', i => i.name, i => `showQuickActions('nni','${i.id}')`);
                    collect(dfRoutes, 'DF Route', '🌑', i => i.routeName, i => `showQuickActions('dfroute','${i.id}')`);
                    collect(dfSegments, 'DF Segment', '🌑', i => i.segmentName || ('Segment ' + (i.segmentOrder || '')), i => i.routeId ? `viewDarkFiberRoute('${i.routeId}')` : '');
                    activity.sort((a, b) => b.when - a.when);
                    const recentActivity = activity.slice(0, 15);
                    
                    const timeAgo = (d) => {
                        const s = Math.floor((Date.now() - d.getTime()) / 1000);
                        if (s < 60) return 'just now';
                        if (s < 3600) return Math.floor(s / 60) + 'm ago';
                        if (s < 86400) return Math.floor(s / 3600) + 'h ago';
                        if (s < 604800) return Math.floor(s / 86400) + 'd ago';
                        return d.toLocaleDateString();
                    };
                    
                    // ===== Mini bar charts (pure CSS) =====
                    const barChart = (counts, palette) => {
                        const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 6);
                        const max = entries.length ? entries[0][1] : 1;
                        return entries.length === 0 ? '<div style="color: var(--text-tertiary); font-size: 0.85rem;">No data yet</div>' :
                            entries.map(([label, count], i) => `
                            <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem;">
                                <div style="flex: 0 0 110px; font-size: 0.8rem; text-align: right; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${label}</div>
                                <div style="flex: 1; height: 18px; background: var(--bg-tertiary); border-radius: 4px; overflow: hidden;">
                                    <div style="height: 100%; width: ${Math.max((count / max) * 100, 4)}%; background: ${palette[i % palette.length]}; border-radius: 4px;"></div>
                                </div>
                                <div style="flex: 0 0 32px; font-size: 0.85rem; font-weight: 600;">${count}</div>
                            </div>`).join('');
                    };
                    const statusCounts = {};
                    circuits.forEach(c => { const k = (c.status || 'unknown').toLowerCase(); statusCounts[k] = (statusCounts[k] || 0) + 1; });
                    const mfgCounts = {};
                    equipment.forEach(e => { const k = e.manufacturer || 'Unknown'; mfgCounts[k] = (mfgCounts[k] || 0) + 1; });
                    const CHART_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4'];
                    
                    content.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                            <h1 style="font-size: 2rem;">Dashboard</h1>
                            <div style="display: flex; gap: 0.75rem;">
                                <button class="btn-secondary" onclick="exportAllToExcel(this)">⬇️ Export All (XLSX)</button>
                                <button class="btn-secondary" onclick="backupAllToJson(this)">💾 Backup (JSON)</button>
                                <button class="btn-secondary" onclick="removeDuplicates()">🔄 Remove Duplicates</button>
                            </div>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-card" onclick="goToPage('sites')" style="cursor: pointer;" title="Go to Sites">
                                <h3>TOTAL SITES</h3>
                                <div class="value">${sites.length}</div>
                            </div>
                            <div class="stat-card" onclick="goToPage('racks')" style="cursor: pointer;" title="Go to Racks">
                                <h3>TOTAL RACKS</h3>
                                <div class="value">${racks.length}</div>
                            </div>
                            <div class="stat-card" onclick="goToPage('equipment')" style="cursor: pointer;" title="Go to Equipment">
                                <h3>EQUIPMENT</h3>
                                <div class="value">${equipment.length}</div>
                            </div>
                            <div class="stat-card" onclick="goToPage('fdps')" style="cursor: pointer;" title="Go to FDPs">
                                <h3>FDPS</h3>
                                <div class="value">${fdps.length}</div>
                            </div>
                            <div class="stat-card" onclick="goToPage('circuits')" style="cursor: pointer;" title="Go to Circuits">
                                <h3>CIRCUITS</h3>
                                <div class="value">${circuits.length}</div>
                            </div>
                            <div class="stat-card" onclick="goToPage('nnis')" style="cursor: pointer;" title="Go to NNIs">
                                <h3>NNIS</h3>
                                <div class="value">${nnis.length}</div>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 2rem;" class="dashboard-charts">
                            <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 0.75rem; padding: 1.5rem;">
                                <h2 style="color: var(--accent-primary); margin-bottom: 1rem; font-size: 1.1rem;">⚡ Circuits by Status</h2>
                                ${barChart(statusCounts, CHART_COLORS)}
                            </div>
                            <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 0.75rem; padding: 1.5rem;">
                                <h2 style="color: var(--accent-primary); margin-bottom: 1rem; font-size: 1.1rem;">🖥️ Equipment by Manufacturer</h2>
                                ${barChart(mfgCounts, CHART_COLORS)}
                            </div>
                        </div>
                        <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 0.75rem; padding: 1.5rem; margin-top: 1.5rem;">
                            <h2 style="color: var(--accent-primary); margin-bottom: 1rem; font-size: 1.1rem;">🕐 Recent Activity</h2>
                            ${recentActivity.length === 0 ? '<p style="color: var(--text-secondary);">No recent changes. ' + (sites.length + racks.length + equipment.length + fdps.length + circuits.length + nnis.length) + ' total entities tracked.</p>' :
                            recentActivity.map(a => `
                                <div style="display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border-color); font-size: 0.9rem;">
                                    <span>${a.icon}</span>
                                    ${a.click ? `<a href="javascript:void(0)" onclick="${a.click}" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">${a.name}</a>` : `<strong>${a.name}</strong>`}
                                    <span style="color: var(--text-tertiary); font-size: 0.8rem;">${a.type}</span>
                                    <span style="color: var(--text-secondary); margin-left: auto; font-size: 0.8rem; white-space: nowrap;">${a.isNew ? '✨ created' : '✏️ edited'}${a.who ? ' by ' + a.who : ''} · ${timeAgo(a.when)}</span>
                                </div>`).join('')}
                            <div style="margin-top: 0.75rem; font-size: 0.78rem; color: var(--text-tertiary);">Full per-field history is in SharePoint: list → item → Version History.</div>
                        </div>
                    `;
                } catch (error) {
                    console.error('Dashboard error:', error);
                    content.innerHTML = `
                        <h1>Dashboard</h1>
                        <div style="background: var(--danger); color: white; padding: 1rem; border-radius: 0.5rem; margin-top: 1rem;">
                            Error loading data: ${error.message}
                        </div>
                    `;
                }
            } else if (page === 'duplicates') {
                await renderDuplicatesPage();
            } else if (page === 'sites') {
                await renderSitesPage();
            } else if (page === 'siteMap') {
                await renderSiteMapPage();
            } else if (page === 'racks') {
                await renderRacksPage();
            } else if (page === 'equipment') {
                await renderEquipmentPage();
            } else if (page === 'fdps') {
                await renderFdpsPage();
            } else if (page === 'circuits') {
                await renderCircuitsPage();
            } else if (page === 'nnis') {
                await renderNnisPage();
            } else if (page === 'search') {
                await renderGlobalSearchPage();
            } else if (page === 'availablePorts') {
                await renderAvailablePortsPage();
            } else if (page === 'templates') {
                await renderTemplatesPage();
            } else if (page === 'darkfiber') {
                await renderDarkFiberPage();
            } else {
                content.innerHTML = `
                    <h1 style="font-size: 2rem; margin-bottom: 2rem;">${page.charAt(0).toUpperCase() + page.slice(1)}</h1>
                    <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 0.75rem; padding: 2rem;">
                        <p style="color: var(--text-secondary);">This section is fully functional in the complete version.</p>
                        <p style="color: var(--text-tertiary); margin-top: 1rem;">SharePoint Lists API is working - add full CRUD forms here.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
