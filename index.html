                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div style="display: flex; gap: 0.5rem;">
                                                            <button onclick="viewFdpPorts('${stat.id}')" class="btn-sm" style="font-size: 0.75rem; padding: 0.4rem 0.75rem;" title="View port map">🔌 Ports</button>
                                                            ${stat.siteId ? `
                                                                <button onclick="viewSiteDetails('${stat.siteId}')" class="btn-sm" style="font-size: 0.75rem; padding: 0.4rem 0.75rem;" title="View site">👁️</button>
                                                            ` : ''}
                                                        </div>
                                                    </td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            ` : `
                                <div style="text-align: center; padding: 3rem; color: var(--text-secondary); background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 0.5rem;">
                                    No FDPs with ports configured yet.
                                </div>
                            `}
                        </div>
                        
                        <!-- Port Availability - Equipment Section (by Vendor) -->
                        <div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 2px solid var(--accent-primary);">
                                <h2 style="font-size: 1.5rem; color: var(--accent-primary); margin: 0;">🖥️ Equipment</h2>
                                <div style="display: flex; gap: 1rem; font-size: 0.9rem;">
                                    <div><span style="color: var(--text-secondary);">Total:</span> <span style="color: var(--text-primary); font-weight: 600;">${totalEquipmentPorts}</span></div>
                                    <div><span style="color: var(--text-secondary);">Available:</span> <span style="color: var(--success); font-weight: 600;">${totalEquipmentAvailable}</span></div>
                                    <div><span style="color: var(--text-secondary);">Used:</span> <span style="color: var(--warning); font-weight: 600;">${totalEquipmentUsed}</span></div>
                                    <div><span style="color: var(--text-secondary);">Utilization:</span> <span style="color: ${equipmentUtilization > 80 ? 'var(--danger)' : equipmentUtilization > 50 ? 'var(--warning)' : 'var(--success)'}; font-weight: 600;">${equipmentUtilization}%</span></div>
                                </div>
                            </div>
                            
                            ${Object.keys(equipmentByVendor).length > 0 ? `
                                ${Object.keys(equipmentByVendor).sort().map(vendor => {
                                    const vendorEquipment = equipmentByVendor[vendor];
                                    const vendorTotalPorts = vendorEquipment.reduce((sum, e) => sum + e.totalPorts, 0);
                                    const vendorAvailable = vendorEquipment.reduce((sum, e) => sum + e.availablePorts, 0);
                                    const vendorUsed = vendorEquipment.reduce((sum, e) => sum + e.usedPorts, 0);
                                    const vendorUtil = vendorTotalPorts > 0 ? ((vendorUsed / vendorTotalPorts) * 100).toFixed(1) : 0;
                                    
                                    return `
                                        <div style="margin-bottom: 2rem;">
                                            <div style="background: var(--bg-tertiary); padding: 1rem 1.5rem; border-radius: 0.5rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
                                                <h3 style="font-size: 1.1rem; color: var(--text-primary); margin: 0; font-weight: 600;">
                                                    ${vendor} <span style="font-size: 0.85rem; color: var(--text-tertiary); font-weight: 400;">(${vendorEquipment.length} devices)</span>
                                                </h3>
                                                <div style="display: flex; gap: 1rem; font-size: 0.85rem;">
                                                    <div><span style="color: var(--text-secondary);">Total:</span> <span style="color: var(--text-primary); font-weight: 600;">${vendorTotalPorts}</span></div>
                                                    <div><span style="color: var(--text-secondary);">Available:</span> <span style="color: var(--success); font-weight: 600;">${vendorAvailable}</span></div>
                                                    <div><span style="color: var(--text-secondary);">Utilization:</span> <span style="color: ${vendorUtil > 80 ? 'var(--danger)' : vendorUtil > 50 ? 'var(--warning)' : 'var(--success)'}; font-weight: 600;">${vendorUtil}%</span></div>
                                                </div>
                                            </div>
                                            
                                            <div class="table-container">
                                                <table>
                                                    <thead>
                                                        <tr>
                                                            <th>Equipment Name</th>
                                                            <th>Model</th>
                                                            <th>Site</th>
                                                            <th>Total Ports</th>
                                                            <th>Available</th>
                                                            <th>In Use</th>
                                                            <th>Utilization</th>
                                                            <th>Actions</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        ${vendorEquipment.map(stat => {
                                                            const equip = equipment.find(e => e.id === stat.id);
                                                            return `
                                                                <tr data-site="${stat.siteName}" data-type="${stat.type}" data-has-available="${stat.availablePorts > 0}">
                                                                    <td>
                                                                        <div style="font-weight: 600; color: var(--text-primary);">${stat.name}</div>
                                                                        ${!stat.hasPortConfig ? '<div style="font-size: 0.75rem; color: var(--warning); margin-top: 0.25rem;">⚠️ No port config</div>' : ''}
                                                                    </td>
                                                                    <td>
                                                                        <div style="font-size: 0.9rem; color: var(--text-secondary);">${equip.model || '-'}</div>
                                                                        ${stat.hasPortConfig && stat.portConfigText !== 'Not configured' ? `<div style="font-size: 0.75rem; color: var(--text-tertiary); margin-top: 0.25rem;" title="${stat.portConfigText}">${stat.portConfigText.length > 30 ? stat.portConfigText.substring(0, 30) + '...' : stat.portConfigText}</div>` : ''}
                                                                    </td>
                                                                    <td>
                                                                        <span style="cursor: pointer; color: var(--accent-primary);" onclick="viewSiteDetails('${stat.siteId}')" title="View site">
                                                                            ${stat.siteName}
                                                                        </span>
                                                                    </td>
                                                                    <td style="font-family: 'JetBrains Mono', monospace; font-weight: 600;">
                                                                        ${stat.totalPorts > 0 ? stat.totalPorts : '<span style="color: var(--text-tertiary);">-</span>'}
                                                                    </td>
                                                                    <td>
                                                                        ${stat.totalPorts > 0 ? `
                                                                            <div style="display: flex; align-items: center; gap: 0.5rem;">
                                                                                <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; color: ${stat.availablePorts > 0 ? 'var(--success)' : 'var(--text-tertiary)'}; font-size: 1.1rem;">
                                                                                    ${stat.availablePorts}
                                                                                </span>
                                                                                ${stat.availablePorts > 0 ? '<span style="color: var(--success);">✓</span>' : '<span style="color: var(--text-tertiary);">⊘</span>'}
                                                                            </div>
                                                                        ` : '<span style="color: var(--text-tertiary); font-size: 0.85rem;">N/A</span>'}
                                                                    </td>
                                                                    <td>
                                                                        ${stat.totalPorts > 0 ? `
                                                                            <div style="font-family: 'JetBrains Mono', monospace;">
                                                                                ${stat.usedPorts}
                                                                                ${stat.circuits > 0 || stat.nnis > 0 ? `<span style="font-size: 0.75rem; color: var(--text-tertiary); margin-left: 0.25rem;">(${stat.circuits}C, ${stat.nnis}N)</span>` : ''}
                                                                            </div>
                                                                        ` : '<span style="color: var(--text-tertiary); font-size: 0.85rem;">N/A</span>'}
                                                                    </td>
                                                                    <td>
                                                                        ${stat.totalPorts > 0 ? `
                                                                            <div style="display: flex; align-items: center; gap: 0.75rem;">
                                                                                <div style="flex: 1; background: var(--bg-tertiary); border-radius: 0.25rem; height: 8px; overflow: hidden;">
                                                                                    <div style="height: 100%; background: ${stat.utilization > 80 ? 'var(--danger)' : stat.utilization > 50 ? 'var(--warning)' : 'var(--success)'}; width: ${stat.utilization}%; transition: width 0.3s;"></div>
                                                                                </div>
                                                                                <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; color: ${stat.utilization > 80 ? 'var(--danger)' : stat.utilization > 50 ? 'var(--warning)' : 'var(--success)'}; min-width: 50px;">
                                                                                    ${stat.utilization}%
                                                                                </span>
                                                                            </div>
                                                                        ` : '<span style="color: var(--text-tertiary); font-size: 0.85rem;">-</span>'}
                                                                    </td>
                                                                    <td>
                                                                        <div style="display: flex; gap: 0.5rem;">
                                                                            ${stat.totalPorts > 0 ? `
                                                                                <button onclick="viewEquipmentPorts('${stat.id}')" class="btn-sm" style="font-size: 0.75rem; padding: 0.4rem 0.75rem;" title="View port map">🔌 Ports</button>
                                                                            ` : `
                                                                                <button onclick="editEquipment('${stat.id}')" class="btn-sm" style="font-size: 0.75rem; padding: 0.4rem 0.75rem; background: var(--warning);" title="Add port configuration">⚙️ Config</button>
                                                                            `}
                                                                            ${stat.siteId ? `
                                                                                <button onclick="viewSiteDetails('${stat.siteId}')" class="btn-sm" style="font-size: 0.75rem; padding: 0.4rem 0.75rem;" title="View site">👁️</button>
                                                                            ` : ''}
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                            `;
                                                        }).join('')}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            ` : `
                                <div style="text-align: center; padding: 3rem; color: var(--text-secondary); background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 0.5rem;">
                                    No equipment with ports configured yet.
                                </div>
                            `}
                        </div>
                        
                        <!-- Legend -->
                        <div style="margin-top: 2rem; padding: 1.5rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 0.75rem;">
                            <h3 style="margin-bottom: 1rem; color: var(--accent-primary);">💡 Quick Guide</h3>
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; font-size: 0.9rem;">
                                <div>
                                    <div style="color: var(--text-secondary); margin-bottom: 0.25rem;">• <strong>Equipment Port Counts:</strong></div>
                                    <div style="color: var(--text-tertiary); padding-left: 1rem;">Automatically parsed from Port Configuration field (e.g., "40x1G, 6x100G" = 46 ports)</div>
                                </div>
                                <div>
                                    <div style="color: var(--text-secondary); margin-bottom: 0.25rem;">• <strong>Available Ports:</strong></div>
                                    <div style="color: var(--text-tertiary); padding-left: 1rem;">Ports not currently assigned to circuits or NNIs</div>
                                </div>
                                <div>
                                    <div style="color: var(--text-secondary); margin-bottom: 0.25rem;">• <strong>In Use:</strong></div>
                                    <div style="color: var(--text-tertiary); padding-left: 1rem;">Shows circuit count (C) and NNI count (N)</div>
                                </div>
                                <div>
                                    <div style="color: var(--text-secondary); margin-bottom: 0.25rem;">• <strong>Utilization Colors:</strong></div>
                                    <div style="color: var(--text-tertiary); padding-left: 1rem;"><span style="color: var(--success);">Green</span> <50% | <span style="color: var(--warning);">Orange</span> 50-80% | <span style="color: var(--danger);">Red</span> >80%</div>
                                </div>
                                <div>
                                    <div style="color: var(--text-secondary); margin-bottom: 0.25rem;">• <strong>⚠️ No port config:</strong></div>
                                    <div style="color: var(--text-tertiary); padding-left: 1rem;">Equipment without Port Configuration set. Click ⚙️ Config to add.</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
            } catch (error) {
                console.error('Error rendering available ports:', error);
                content.innerHTML = `
                    <h1>Available Ports</h1>
                    <div style="background: var(--danger); color: white; padding: 1rem; border-radius: 0.5rem; margin-top: 1rem;">
                        Error loading port availability: ${error.message}
                    </div>
                `;
            }
        }
        
        // Filter function for available ports tables
        function filterAvailablePorts() {
            const siteFilter = document.getElementById('siteFilterSelect').value;
            const typeFilter = document.getElementById('typeFilterSelect').value;
            const availFilter = document.getElementById('availabilityFilterSelect').value;
            
            // Get all tables (now multiple tables across sections)
            const rows = document.querySelectorAll('table tbody tr[data-site]');
            
            rows.forEach(row => {
                const rowSite = row.getAttribute('data-site');
                const rowType = row.getAttribute('data-type');
                const rowHasAvailable = row.getAttribute('data-has-available') === 'true';
                
                let show = true;
                
                if (siteFilter && rowSite !== siteFilter) show = false;
                if (typeFilter && rowType !== typeFilter) show = false;
                if (availFilter === 'available' && !rowHasAvailable) show = false;
                if (availFilter === 'full' && rowHasAvailable) show = false;
                
                row.style.display = show ? '' : 'none';
            });
        }

        // Navigation
        
        // Navigation History for Back Button
        let navigationHistory = [];
        let currentPage = 'dashboard';
        
        function updateBackButton() {
            const backBtn = document.getElementById('backButton');
            if (backBtn) {
                if (navigationHistory.length > 0) {
                    backBtn.style.display = 'flex';
                } else {
                    backBtn.style.display = 'none';
                }
            }
        }
        
        function goBack() {
            if (navigationHistory.length > 0) {
                const previousPage = navigationHistory.pop();
                currentPage = previousPage;
                
                // Update active nav item
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.remove('active');
                    const itemText = item.textContent.toLowerCase().trim();
                    if (itemText.includes(previousPage)) {
                        item.classList.add('active');
                    }
                });
                
                render(previousPage); // Render without adding to history
            }
        }
        
        // Programmatic navigation (dashboard cards, links) - syncs sidebar highlight
        function goToPage(page) {
            if (page !== currentPage) {
                navigationHistory.push(currentPage);
                currentPage = page;
            }
            document.querySelectorAll('.nav-item').forEach(item => {
                const oc = item.getAttribute('onclick') || '';
                item.classList.toggle('active', oc.includes("navigateTo('" + page + "')"));
            });
            render(page);
        }

        function navigateTo(page) {
            // Don't add to history if going to same page
            if (page !== currentPage) {
                navigationHistory.push(currentPage);
                currentPage = page;
            }
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            render(page);
        }

        // Render function (simplified for demo)
        async function render(page, skipHistory = false) {
            const content = document.getElementById('content');
            
            // Update back button visibility
            updateBackButton();
            
            if (page === 'dashboard') {
                try {
                    const [sites, racks, equipment, fdps, circuits, nnis] = await Promise.all([
                        store.getSites(),
                        store.getRacks(),
                        store.getEquipment(),
                        store.getFdps(),
                        store.getCircuits(),
                        store.getNnis()
                    ]);
                    
                    content.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                            <h1 style="font-size: 2rem;">Dashboard</h1>
                            <button class="btn-secondary" onclick="removeDuplicates()">🔄 Remove Duplicates</button>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-card" onclick="goToPage('sites')" style="cursor: pointer;" title="Go to Sites">
                                <h3>TOTAL SITES</h3>
                                <div class="value">${sites.length}</div>
                            </div>
                            <div class="stat-card" onclick="goToPage('racks')" style="cursor: pointer;" title="Go to Racks">
                                <h3>TOTAL RACKS</h3>
                                <div class="value">${racks.length}</div>
                            </div>
                            <div class="stat-card" onclick="goToPage('equipment')" style="cursor: pointer;" title="Go to Equipment">
                                <h3>EQUIPMENT</h3>
                                <div class="value">${equipment.length}</div>
                            </div>
                            <div class="stat-card" onclick="goToPage('fdps')" style="cursor: pointer;" title="Go to FDPs">
                                <h3>FDPS</h3>
                                <div class="value">${fdps.length}</div>
                            </div>
                            <div class="stat-card" onclick="goToPage('circuits')" style="cursor: pointer;" title="Go to Circuits">
                                <h3>CIRCUITS</h3>
                                <div class="value">${circuits.length}</div>
                            </div>
                            <div class="stat-card" onclick="goToPage('nnis')" style="cursor: pointer;" title="Go to NNIs">
                                <h3>NNIS</h3>
                                <div class="value">${nnis.length}</div>
                            </div>
                        </div>
                        <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 0.75rem; padding: 2rem; margin-top: 2rem;">
                            <h2 style="color: var(--accent-primary); margin-bottom: 1rem;">Recent Activity</h2>
                            <p style="color: var(--text-secondary);">System ready. ${sites.length + racks.length + equipment.length + fdps.length + circuits.length + nnis.length} total entities tracked.</p>
                        </div>
                    `;
                } catch (error) {
                    console.error('Dashboard error:', error);
                    content.innerHTML = `
                        <h1>Dashboard</h1>
                        <div style="background: var(--danger); color: white; padding: 1rem; border-radius: 0.5rem; margin-top: 1rem;">
                            Error loading data: ${error.message}
                        </div>
                    `;
                }
            } else if (page === 'duplicates') {
                await renderDuplicatesPage();
            } else if (page === 'sites') {
                await renderSitesPage();
            } else if (page === 'siteMap') {
                await renderSiteMapPage();
            } else if (page === 'racks') {
                await renderRacksPage();
            } else if (page === 'equipment') {
                await renderEquipmentPage();
            } else if (page === 'fdps') {
                await renderFdpsPage();
            } else if (page === 'circuits') {
                await renderCircuitsPage();
            } else if (page === 'nnis') {
                await renderNnisPage();
            } else if (page === 'search') {
                await renderGlobalSearchPage();
            } else if (page === 'availablePorts') {
                await renderAvailablePortsPage();
            } else if (page === 'templates') {
                await renderTemplatesPage();
            } else if (page === 'darkfiber') {
                await renderDarkFiberPage();
            } else {
                content.innerHTML = `
                    <h1 style="font-size: 2rem; margin-bottom: 2rem;">${page.charAt(0).toUpperCase() + page.slice(1)}</h1>
                    <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 0.75rem; padding: 2rem;">
                        <p style="color: var(--text-secondary);">This section is fully functional in the complete version.</p>
                        <p style="color: var(--text-tertiary); margin-top: 1rem;">SharePoint Lists API is working - add full CRUD forms here.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
