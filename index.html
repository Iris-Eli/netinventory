        async function saveCircuit(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            
            // Get equipment ports from multi-select (handle multiple selections)
            const aEquipmentPortSelect = document.getElementById('aEquipmentPortSelect');
            const zEquipmentPortSelect = document.getElementById('zEquipmentPortSelect');
            const aEquipmentPorts = aEquipmentPortSelect ? Array.from(aEquipmentPortSelect.selectedOptions).map(o => o.value).join(',') : '';
            const zEquipmentPorts = zEquipmentPortSelect ? Array.from(zEquipmentPortSelect.selectedOptions).map(o => o.value).join(',') : '';
            
            // Get FDP ports from multi-select (handle multiple selections)
            const aFdpPortSelect = document.getElementById('aFdpPortSelect');
            const zFdpPortSelect = document.getElementById('zFdpPortSelect');
            const aFdpPorts = aFdpPortSelect ? Array.from(aFdpPortSelect.selectedOptions).map(o => o.value).join(',') : '';
            const zFdpPorts = zFdpPortSelect ? Array.from(zFdpPortSelect.selectedOptions).map(o => o.value).join(',') : '';
            
            const circuit = {
                circuitId: formData.get('circuitId'),
                previousCircuitId: formData.get('previousCircuitId') || '',
                direction: formData.get('direction'),
                type: formData.get('type'),
                networkType: formData.get('networkType'),
                provider: formData.get('provider') || '',
                bandwidth: formData.get('bandwidth'),
                status: formData.get('status'),
                
                // A-Location (VLAN 1)
                aLocationSiteId: formData.get('aLocationSiteId'),
                aConnectionType: formData.get('aConnectionType'),
                aFdp: formData.get('aFdp') || '',
                aPort: aFdpPorts || '',
                aEquipment: formData.get('aEquipment') || '',
                aEquipmentPort: aEquipmentPorts || '',
                aEquipmentFdp: formData.get('aEquipmentFdp') || '',
                aEquipmentFdpPorts: formData.get('aEquipmentFdpPorts') || '',
                aNni: formData.get('aNni') || '',
                aNniSubinterface: formData.get('aNniSubinterface') || '',
                
                // Z-Location (VLAN 1)
                zLocationSiteId: formData.get('zLocationSiteId'),
                zConnectionType: formData.get('zConnectionType'),
                zFdp: formData.get('zFdp') || '',
                zPort: zFdpPorts || '',
                zEquipment: formData.get('zEquipment') || '',
                zEquipmentPort: zEquipmentPorts || '',
                zEquipmentFdp: formData.get('zEquipmentFdp') || '',
                zEquipmentFdpPorts: formData.get('zEquipmentFdpPorts') || '',
                zNni: formData.get('zNni') || '',
                zNniSubinterface: formData.get('zNniSubinterface') || '',
                
                // CPE
                hasCpe: formData.get('hasCpe'),
                cpeType: formData.get('cpeType') || '',
                cpeMgmtIp: formData.get('cpeMgmtIp') || '',
                cpeMgmtSubnet: formData.get('cpeMgmtSubnet') || '',
                cpeMgmtGateway: formData.get('cpeMgmtGateway') || '',
                cpeMgmtVlan: formData.get('cpeMgmtVlan') || '',
                
                notes: formData.get('notes') || '',
                additionalLocations: ''
            };
            
            // COLLECT MULTI-VLAN DATA
            const vlanCount = parseInt(formData.get('vlanCount')) || 1;
            const vlans = [];
            
            // VLAN 1 (using standard A/Z fields)
            const vlan1 = {
                vlanId: formData.get('vlan1_vlanId') || '',
                aLocationSiteId: circuit.aLocationSiteId,
                aConnectionType: circuit.aConnectionType,
                aFdp: circuit.aFdp,
                aPort: circuit.aPort,
                aEquipment: circuit.aEquipment,
                aEquipmentPort: circuit.aEquipmentPort,
                aNni: circuit.aNni,
                aNniSubinterface: circuit.aNniSubinterface,
                zLocationSiteId: circuit.zLocationSiteId,
                zConnectionType: circuit.zConnectionType,
                zFdp: circuit.zFdp,
                zPort: circuit.zPort,
                zEquipment: circuit.zEquipment,
                zEquipmentPort: circuit.zEquipmentPort,
                zNni: circuit.zNni,
                zNniSubinterface: circuit.zNniSubinterface
            };
            vlans.push(vlan1);
            
            // VLAN 2+ (from additional sections)
            for (let i = 2; i <= vlanCount; i++) {
                // Get FDP ports for this VLAN
                const vlanAFdpPortSelect = document.getElementById(`vlan${i}_AFdpPortSelect`);
                const vlanZFdpPortSelect = document.getElementById(`vlan${i}_ZFdpPortSelect`);
                const vlanAFdpPorts = vlanAFdpPortSelect ? Array.from(vlanAFdpPortSelect.selectedOptions).map(o => o.value).join(',') : '';
                const vlanZFdpPorts = vlanZFdpPortSelect ? Array.from(vlanZFdpPortSelect.selectedOptions).map(o => o.value).join(',') : '';
                
                // Get equipment ports for this VLAN
                const vlanAEquipPortSelect = document.getElementById(`vlan${i}_AEquipmentPortSelect`);
                const vlanZEquipPortSelect = document.getElementById(`vlan${i}_ZEquipmentPortSelect`);
                const vlanAEquipPorts = vlanAEquipPortSelect ? Array.from(vlanAEquipPortSelect.selectedOptions).map(o => o.value).join(',') : '';
                const vlanZEquipPorts = vlanZEquipPortSelect ? Array.from(vlanZEquipPortSelect.selectedOptions).map(o => o.value).join(',') : '';
                
                const vlan = {
                    vlanId: formData.get(`vlan${i}_vlanId`) || '',
                    aLocationSiteId: formData.get(`vlan${i}_aLocationSiteId`) || '',
                    aConnectionType: formData.get(`vlan${i}_aConnectionType`) || '',
                    aFdp: formData.get(`vlan${i}_aFdp`) || '',
                    aPort: vlanAFdpPorts || '',
                    aEquipment: formData.get(`vlan${i}_aEquipment`) || '',
                    aEquipmentPort: vlanAEquipPorts || '',
                    aNni: formData.get(`vlan${i}_aNni`) || '',
                    aNniSubinterface: formData.get(`vlan${i}_aNniSubinterface`) || '',
                    zLocationSiteId: formData.get(`vlan${i}_zLocationSiteId`) || '',
                    zConnectionType: formData.get(`vlan${i}_zConnectionType`) || '',
                    zFdp: formData.get(`vlan${i}_zFdp`) || '',
                    zPort: vlanZFdpPorts || '',
                    zEquipment: formData.get(`vlan${i}_zEquipment`) || '',
                    zEquipmentPort: vlanZEquipPorts || '',
                    zNni: formData.get(`vlan${i}_zNni`) || '',
                    zNniSubinterface: formData.get(`vlan${i}_zNniSubinterface`) || ''
                };
                vlans.push(vlan);
            }
            
            // Store VLANs as JSON
            circuit.circuitVlans = JSON.stringify(vlans);
            
            console.log('=== CIRCUIT SAVE DEBUG ===');
            console.log('VLAN Count:', vlanCount);
            console.log('VLANs Array:', vlans);
            console.log('Full circuit object:', circuit);
            console.log('========================');
            
            try {
                // HANDLE CPE EQUIPMENT - Create new or update existing
                if (circuit.hasCpe === 'yes' && circuit.cpeType && circuit.zLocationSiteId) {
                    const sites = await store.getSites();
                    const zSite = sites.find(s => s.id === circuit.zLocationSiteId);
                    
                    if (zSite) {
                        // Build CPE equipment data
                        const cpeEquipment = {
                            name: `CPE-${circuit.circuitId || 'AUTO'}`,
                            type: circuit.cpeType,
                            siteId: circuit.zLocationSiteId,
                            rackId: '',
                            rackUnit: '',
                            manufacturer: circuit.cpeType === 'accedian' ? 'Accedian' : 'Cisco',
                            model: circuit.cpeType === 'accedian' ? 'Accedian' : 
                                   circuit.cpeType === '3924' ? 'ISR 3924' :
                                   circuit.cpeType === '3922' ? 'ISR 3922' : 'Unknown',
                            serialNumber: '',
                            ipAddress: circuit.cpeMgmtIp || '',
                            notes: `CPE for circuit ${circuit.circuitId || 'pending'}. Management: ${circuit.cpeMgmtIp || 'N/A'}/${circuit.cpeMgmtSubnet || 'N/A'} GW: ${circuit.cpeMgmtGateway || 'N/A'} VLAN: ${circuit.cpeMgmtVlan || 'N/A'}`,
                            status: 'active',
                            function: 'CPE'
                        };
                        
                        if (circuit.zEquipment) {
                            // UPDATE existing CPE equipment
                            console.log('Updating existing CPE equipment:', circuit.zEquipment);
                            await store.updateEquipment(circuit.zEquipment, cpeEquipment);
                            console.log('✓ CPE equipment updated');
                        } else {
                            // CREATE new CPE equipment
                            console.log('Creating new CPE equipment...');
                            const createdEquipment = await store.addEquipment(cpeEquipment);
                            circuit.zEquipment = createdEquipment.id;
                            console.log('✓ CPE equipment created:', createdEquipment.id);
                            alert(`✓ CPE equipment created: ${cpeEquipment.name} at ${zSite.name || zSite.location}`);
                        }
                    }
                }
                
                if (editingCircuitId) {
                    await store.updateCircuit(editingCircuitId, circuit);
                    alert('Circuit updated successfully!');
                } else {
                    await store.addCircuit(circuit);
                    alert('Circuit added successfully!');
                }
                closeCircuitModal();
                await renderCircuitsPage();
            } catch (error) {
                console.error('Save error:', error);
                alert('Error saving circuit: ' + error.message);
            }
        }

        // Universal View Modal - can display any entity's details
        // Drill-down history: stackViewModal() before opening a child view enables the ← Back button
        let viewModalStack = [];
        let currentViewModalConfig = null;

        function stackViewModal() {
            if (currentViewModalConfig) viewModalStack.push(currentViewModalConfig);
            const existing = document.getElementById('universalViewModal');
            if (existing) existing.remove();
        }

        function viewModalBack() {
            if (viewModalStack.length > 0) {
                const previous = viewModalStack.pop();
                showViewModal(previous, true);
            }
        }

        function showViewModal(config, isBack = false) {
            currentViewModalConfig = config;

        async function editNni(nni) {
            // Safety check - ensure modal exists
            if (!document.getElementById('nniModal')) {
                console.log('Nni modal not found, initializing...');
                initializeModals();
            }
            
            editingNniId = nni.id;
            document.getElementById('nniModalTitle').textContent = 'Edit NNI';
            const form = document.getElementById('nniForm');
            
            // Populate dropdowns
            const [sites, equipment, fdps] = await Promise.all([
                store.getSites(),
                store.getEquipment(),
                store.getFdps()
            ]);
            
            const siteSelect = document.getElementById('nniSiteSelect');
            siteSelect.innerHTML = '<option value="">Select Site...</option>' + sites.map(site => `<option value="${site.id}">${site.name}</option>`).join('');
            
            const equipmentSelect = document.getElementById('nniEquipmentSelect');
            equipmentSelect.innerHTML = '<option value="">Select Equipment...</option>' + equipment.map(eq => `<option value="${eq.id}">${eq.name} (${eq.type || 'N/A'})</option>`).join('');
            
            const fdpSelect = document.getElementById('nniFdpSelect');
            fdpSelect.innerHTML = '<option value="">Select FDP...</option>' + fdps.map(fdp => `<option value="${fdp.id}">${fdp.name}</option>`).join('');
            
            // Populate form values
            form.elements.name.value = nni.name || '';
            if (nni.direction) form.querySelector(`input[name="direction"][value="${nni.direction}"]`).checked = true;
            form.elements.siteId.value = nni.siteId || '';
            form.elements.connectionType.value = nni.connectionType || '';
            form.elements.equipmentID.value = nni.equipmentID || '';
            form.elements.fdpId.value = nni.fdpId || '';
            form.elements.contact.value = nni.contact || '';
            form.elements.description.value = nni.description || '';
            form.elements.notes.value = nni.notes || '';
            
            // Update port dropdowns if equipment/FDP selected
            if (nni.equipmentID) {
                await updateNniEquipmentPorts();
                // Pre-select ports
                const portsSelect = document.getElementById('nniEquipmentPortsSelect');
                const selectedPorts = (nni.equipmentPorts || '').split(',').map(p => p.trim());
                Array.from(portsSelect.options).forEach(option => {
                    if (selectedPorts.includes(option.value)) {
                        option.selected = true;
                    }
                });
            }
            
            if (nni.fdpId) {
                await updateNniFdpPorts();
                // Pre-select ports
                const portsSelect = document.getElementById('nniFdpPortsSelect');
                const selectedPorts = (nni.fdpPorts || '').split(',').map(p => p.trim());
                Array.from(portsSelect.options).forEach(option => {
                    if (selectedPorts.includes(option.value)) {
                        option.selected = true;
                    }
                });
            }
            
            document.getElementById('nniModal').classList.add('active');
        }
        
        function closeNniModal() {
            document.getElementById('nniModal').classList.remove('active');
            editingNniId = null;
        }
        
        async function saveNni(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            
            // Get selected ports from multi-select (returns array)
            const equipmentPortsSelect = document.getElementById('nniEquipmentPortsSelect');
            const fdpPortsSelect = document.getElementById('nniFdpPortsSelect');
            const equipmentPorts = Array.from(equipmentPortsSelect.selectedOptions).map(o => o.value).join(', ');
            const fdpPorts = Array.from(fdpPortsSelect.selectedOptions).map(o => o.value).join(', ');
            
            const nni = {
                name: formData.get('name'),
                direction: formData.get('direction'),
                siteId: formData.get('siteId'),
                connectionType: formData.get('connectionType') || '',
                equipmentID: formData.get('equipmentID') || '',
                equipmentPorts: equipmentPorts || '',
                fdpId: formData.get('fdpId') || '',
                fdpPorts: fdpPorts || '',
                contact: formData.get('contact') || '',
                description: formData.get('description') || '',
                notes: formData.get('notes') || ''
            };
            
            try {
                if (editingNniId) {
                    await store.updateNni(editingNniId, nni);
                    alert('NNI updated successfully!');
                } else {
                    await store.addNni(nni);
                    alert('NNI added successfully!');
                }
                closeNniModal();
                await renderNnisPage();
            } catch (error) {
                console.error('Save error:', error);
                alert('Error saving NNI: ' + error.message);
            }
        }
        
        async function deleteNni(id) {
            if (!confirm('Are you sure you want to delete this NNI?')) return;
            try {
                await store.deleteNni(id);
                alert('NNI deleted successfully!');
                await renderNnisPage();
            } catch (error) {
                console.error('Delete error:', error);
                alert('Error deleting NNI: ' + error.message);
            }
        }
        
        async function viewNniDetails(nniId) {
            const nni = (await store.getNnis()).find(n => n.id === nniId);
            if (!nni) {
                alert('NNI not found');
                return;
            }
            
            const [circuits, site, equipment, fdp] = await Promise.all([
                store.getCircuits().then(c => c.filter(cir => cir.aNni === nniId || cir.zNni === nniId)),
                nni.siteId ? store.getSites().then(s => s.find(site => site.id === nni.siteId)) : Promise.resolve(null),
                nni.equipmentID ? store.getEquipment().then(e => e.find(eq => eq.id === nni.equipmentID)) : Promise.resolve(null),
                nni.fdpId ? store.getFdps().then(f => f.find(fdp => fdp.id === nni.fdpId)) : Promise.resolve(null)
            ]);
            
            const directionLabel = nni.direction === 'customer' ? 'Customer' : nni.direction === 'type-ii-provider' ? 'Type II Provider' : 'Router/Internal';
            
            showViewModal({
                title: `NNI Details: ${nni.name}`,
                sections: [
                    {
                        title: 'NNI Information',
                        type: 'details',
                        data: [
                            { label: 'NNI Name', value: nni.name },
                            { label: 'Direction', value: directionLabel },
                            { label: 'Site', value: site ? site.name : (nni.siteId || '-') },
                            { label: 'Connection Type', value: nni.connectionType || '-' },
                            { label: 'Equipment', value: equipment ? `${equipment.name} (${equipment.type || 'N/A'})` : (nni.equipmentID || '-') },
                            { label: 'Equipment Ports', value: nni.equipmentPorts || '-' },
                            { label: 'FDP', value: fdp ? fdp.name : (nni.fdpId || '-') },
                            { label: 'FDP Ports', value: nni.fdpPorts || '-' },
                            { label: 'Contact', value: nni.contact || '-' },
                            { label: 'Description', value: nni.description || '-' },
                            { label: 'Notes', value: nni.notes || '-' }
                        ]
                    },
                    {
                        title: `Circuits Using This NNI (${circuits.length})`,
                        type: 'table',
                        data: circuits,
                        columns: ['circuitId', 'type', 'direction', 'status', 'provider'],
                        headers: ['Circuit ID', 'Type', 'Direction', 'Status', 'Provider'],
                        emptyMessage: 'No circuits using this NNI'
                    }
                ]
            });

        async function viewRackDetails(rackId) {
            const rack = (await store.getRacks()).find(r => r.id === rackId);
            if (!rack) {
                alert('Rack not found');
                return;
            }
            
            const [equipment, site] = await Promise.all([
                store.getEquipment().then(e => e.filter(eq => eq.rackId === rackId)),
                rack.siteId ? store.getSites().then(s => s.find(site => site.id === rack.siteId)) : Promise.resolve(null)
            ]);
            
            showViewModal({
                title: `Rack Details: ${rack.name}`,
                sections: [
                    {
                        title: 'Rack Information',
                        type: 'details',
                        data: [
                            { label: 'Rack Name', value: rack.name },
                            { label: 'Site', value: site ? site.name : (rack.siteId || '-') },
                            { label: 'Location', value: rack.location || '-' },

        // Normalize NNI subinterface display (44.100, 100, .100 all show as "100")
        function normalizeSubinterface(subinterface) {
            if (!subinterface) return '-';
            
            const str = String(subinterface).trim();
            
            // Handle formats: "44.100", "100", ".100", etc.
            // Extract the last number after the last dot, or the whole number if no dot
            const match = str.match(/\.(\d+)$/);
            if (match) {
                // Has a dot - return number after last dot
                return match[1];
            }
            
            // No dot - return the number itself
            const numMatch = str.match(/^(\d+)$/);
            if (numMatch) {
                return numMatch[1];
            }
            
            // If format doesn't match expected patterns, return as-is
            return str;
        }

            const [circuits, nnis, site, rack] = await Promise.all([

                fdp.siteId ? store.getSites().then(s => s.find(site => site.id === fdp.siteId)) : Promise.resolve(null),
                fdp.rackId ? store.getRacks().then(r => r.find(rack => rack.id === fdp.rackId)) : Promise.resolve(null)

            // Map which ports are occupied and by which circuits
            const portCircuits = {}; // port number -> array of circuit objects
            
            circuits.forEach(circuit => {
                // Helper to parse comma-separated ports

                    if (!portString) return [];
                    return portString.split(',').map(p => p.trim()).filter(p => p);
                };
                
                // Check A location - direct FDP connection
                if (circuit.aFdp === fdpId) {
                    const ports = parsePorts(circuit.aPort);
                    console.log(`Circuit ${circuit.circuitId} A-end: FDP match, ports:`, ports);
                    ports.forEach(port => {
                        if (!portCircuits[port]) portCircuits[port] = [];
                        portCircuits[port].push({ 
                            circuitId: circuit.circuitId, 
                            id: circuit.id, 
                            location: 'A',
                            type: circuit.type,
                            direction: circuit.direction
                        });
                    });
                }
                
                // Check A location - equipment-to-FDP connection (dark fiber)
                if (circuit.aEquipmentFdp === fdpId) {
                    const ports = parsePorts(circuit.aEquipmentFdpPorts);

                    ports.forEach(port => {

                        portCircuits[port].push({

                            location: 'Z',
                            type: circuit.type,
                            direction: circuit.direction
                        });
                    });

                // Check Z location - equipment-to-FDP connection (dark fiber)

            // Find NNIs using this FDP
            const assignedNnis = nnis.filter(nni => {

                const matchesFdpId = nni.fdpId === fdpId;
                const hasFdpPorts = nni.fdpPorts && nni.fdpPorts.trim().length > 0;
                return matchesFdpId && hasFdpPorts;

        // Show circuits using a specific port
        async function showPortCircuits(fdpId, portNum) {
            const circuits = await store.getCircuits();
            const portCircuits = circuits.filter(c => {
                const parsePorts = (portString) => {
                    if (!portString) return [];
                    return portString.split(',').map(p => p.trim()).filter(p => p);
                };
                
                const aPorts = c.aFdp === fdpId ? parsePorts(c.aPort) : [];
                const zPorts = c.zFdp === fdpId ? parsePorts(c.zPort) : [];
                
                return aPorts.includes(portNum) || zPorts.includes(portNum);
            });
            
            if (portCircuits.length === 0) {
                alert(`No circuits on port ${portNum}`);
                return;
            }
            
            const circuitList = portCircuits.map(c => 
                `• ${c.circuitId} (${c.type || 'N/A'}) - ${c.direction || 'N/A'}`
            ).join('\n');
            
            alert(`Circuits on Port ${portNum}:\n\n${circuitList}`);
        }
        
        // Equipment Port Map - Visual port configuration and NNI assignments
        async function viewEquipmentPorts(equipmentId) {
            const equipment = (await store.getEquipment()).find(e => e.id === equipmentId);
            if (!equipment) {
                alert('Equipment not found');
                return;
            }
            
            const [nnis, circuits, site, rack] = await Promise.all([
                store.getNnis(),
                store.getCircuits(),
                equipment.siteId ? store.getSites().then(s => s.find(site => site.id === equipment.siteId)) : Promise.resolve(null),
                equipment.rackId ? store.getRacks().then(r => r.find(rack => rack.id === equipment.rackId)) : Promise.resolve(null)
            ]);
            
            // Find circuits that reference this equipment
            const portCircuits = {};
            circuits.forEach(circuit => {
                // Helper to parse comma-separated ports
                const parsePorts = (portString) => {
                    if (!portString) return [];
                    return portString.split(',').map(p => p.trim()).filter(p => p);
                };
                
                // Check A location equipment
                if (circuit.aEquipment === equipmentId) {
                    const ports = parsePorts(circuit.aEquipmentPort);
                    ports.forEach(port => {
                        if (!portCircuits[port]) portCircuits[port] = [];
                        portCircuits[port].push({ 
                            circuitId: circuit.circuitId, 
                            id: circuit.id, 
                            location: 'A',
                            type: circuit.type,
                            direction: circuit.direction
                        });
                    });
                }
                
                // Check Z location equipment
                if (circuit.zEquipment === equipmentId) {
                    const ports = parsePorts(circuit.zEquipmentPort);
                    ports.forEach(port => {
                        if (!portCircuits[port]) portCircuits[port] = [];
                        portCircuits[port].push({ 
                            circuitId: circuit.circuitId, 
                            id: circuit.id, 
                            location: 'Z',
                            type: circuit.type,
                            direction: circuit.direction
                        });
                    });
                }
            });
            
            console.log(`Equipment ${equipmentId}: Port circuits map:`, portCircuits);
            
            // Find NNIs assigned to this equipment
            const assignedNnis = nnis.filter(nni => {
                // Check if this NNI references this equipment (regardless of connectionType)
                const matchesEquipmentId = nni.equipmentID === equipmentId;
                const hasEquipmentPorts = nni.equipmentPorts && nni.equipmentPorts.trim().length > 0;
                return matchesEquipmentId && hasEquipmentPorts;
            });
            
            console.log(`Equipment ${equipmentId}: Found ${assignedNnis.length} NNIs`, assignedNnis);
            
            // Parse port configuration - handle formats like "48x 1G/10G, 4x 100G"
            let totalPorts = 0;
            let portDescription = equipment.portConfig || 'No port configuration';
            let portRanges = [];
            
            const portSegments = equipment.portConfig?.split(',') || [];
            let currentPort = 1;
            
            portSegments.forEach(segment => {
                const match = segment.trim().match(/(\d+)x?\s*(.+)/i);
                if (match) {
                    const count = parseInt(match[1]);
                    const speed = match[2].trim();
                    const startPort = currentPort;
                    const endPort = currentPort + count - 1;
                    
                    portRanges.push({
                        start: startPort,
                        end: endPort,
                        speed: speed,
                        label: `Ports ${startPort}-${endPort}: ${speed}`
                    });
                    
                    totalPorts += count;
                    currentPort = endPort + 1;
                }
            });
            
            if (totalPorts === 0) {
                alert('No port configuration defined for this equipment. Edit equipment to add port configuration (e.g., "48x 1G/10G, 4x 100G")');
                return;
            }
            
            // Map which ports have NNIs
            const nniPorts = {};
            assignedNnis.forEach(nni => {
                if (nni.equipmentPorts) {
                    // Parse port numbers from formats like "Port 46 (100G)" or "1,2,3"
                    const ports = nni.equipmentPorts.split(',').map(p => {
                        const trimmed = p.trim();
                        // Extract number from "Port 46 (100G)" format
                        const match = trimmed.match(/Port\s+(\d+)/i);
                        if (match) return match[1];
                        // Or just return if it's already a number
                        return trimmed;
                    });
                    ports.forEach(port => {
                        if (port) {
                            nniPorts[port] = nni;
                        }
                    });
                }

            console.log('Equipment NNI ports mapped:', nniPorts);

            const availablePorts = totalPorts - usedPortsCircuit - assignedPortCount;
            const utilization = (((usedPortsCircuit + assignedPortCount) / totalPorts) * 100).toFixed(1);
            const utilizationColor = utilization > 80 ? 'var(--danger)' : utilization > 50 ? 'var(--warning)' : 'var(--success)';
            
            const modalHTML = `
                <div class="modal active" id="equipmentPortsModal" onclick="if(event.target === this) closeEquipmentPortsModal()">
                    <div class="modal-content" style="max-width: 1200px; max-height: 90vh; overflow-y: auto;">
                        <div class="modal-header">

                                                ${portRanges.map(range => `
                                                    <div style="font-size: 0.9rem; padding: 0.25rem 0; color: var(--text-primary);">
                                                        <span style="color: var(--accent-primary); font-weight: 600;">Ports ${range.start}-${range.end}:</span> ${range.speed}
                                                    </div>
                                                `).join('')}
                                            </div>
                                        ` : ''}
                                        ${assignedNnis.length > 0 ? `
                                            <div style="border-top: 1px solid var(--border-color); padding-top: 0.75rem; margin-top: 0.75rem;">
                                                <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem;">NNI ASSIGNMENTS</div>
                                                ${assignedNnis.map(nni => `

                                                        <span style="color: var(--success); font-weight: 600;">${nni.name}:</span> Port ${nni.equipmentPorts || 'N/A'}
                                                    </div>
                                                `).join('')}
                                            </div>
                                        ` : ''}
                                    </div>
                                    
                                    <div class="fdp-legend">
                                        <div class="legend-item">
                                            <div class="legend-color available"></div>
                                            <span>Available (${availablePorts})</span>
                                        </div>

                                    <div class="fdp-port-map">
                                        ${Array.from({length: totalPorts}, (_, i) => {

                                            // Find which range this port belongs to
                                            const range = portRanges.find(r => (i + 1) >= r.start && (i + 1) <= r.end);
                                            
                                            // Check if this port has circuits or NNI
                                            const circuitsOnPort = portCircuits[portNum] || [];
                                            const nniOnPort = nniPorts[portNum];
                                            const isOccupied = circuitsOnPort.length > 0;
                                            
                                            // Get max speed from range (e.g., "1G/10G/25G" -> show highest)

        // RU Intelligence: Smart position dropdown that only shows available positions
        async function updateAvailableRackPositions(equipmentId = null) {
            const rackSelect = document.getElementById('equipmentRackSelect');
            const positionSelect = document.getElementById('equipmentRuPosition');
            const sizeInput = document.getElementById('equipmentRuSize');
            
            if (!rackSelect || !positionSelect || !sizeInput) return;
            
            const selectedRackId = rackSelect.value;
            
            if (!selectedRackId) {
                positionSelect.innerHTML = '<option value="">Select rack first...</option>';
                return;
            }
            
            // Get rack details
            const rack = (await store.getRacks()).find(r => r.id === selectedRackId);
            if (!rack) return;
            
            const itemUnits = parseInt(sizeInput.value) || 1;
            
            // Get all equipment and FDPs in this rack (excluding current item if editing)
            const equipment = (await store.getEquipment()).filter(e => 
                e.rackId === selectedRackId && e.id !== equipmentId
            );
            const fdps = (await store.getFdps()).filter(f => 
                f.rackId === selectedRackId
            );
            
            // Build occupancy map
            const occupiedUnits = new Set();
            
            [...equipment, ...fdps].forEach(item => {
                const pos = parseInt(item.rackPosition || item.ruPosition);
                const units = parseInt(item.rackUnits || item.ruSize) || 1;
                if (pos && !isNaN(pos)) {
                    for (let i = 0; i < units; i++) {
                        occupiedUnits.add(pos + i);
                    }
                }
            });
            
            // Find available starting positions
            const availablePositions = [];
            const rackCapacity = parseInt(rack.ruCapacity) || 42;
            const maxPosition = rackCapacity - itemUnits + 1; // Can't start too high
            
            for (let pos = 1; pos <= maxPosition; pos++) {
                // Check if this position and all required units above it are free
                let canFit = true;
                for (let i = 0; i < itemUnits; i++) {
                    if (occupiedUnits.has(pos + i)) {
                        canFit = false;
                        break;
                    }
                }
                if (canFit) {
                    availablePositions.push(pos);
                }
            }
            
            // Save current selection
            const currentSelection = positionSelect.value;
            
            // Populate dropdown
            if (availablePositions.length === 0) {
                positionSelect.innerHTML = '<option value="">No available positions for this size</option>';
            } else {
                positionSelect.innerHTML = '<option value="">Select position...</option>';
                availablePositions.forEach(pos => {
                    const option = document.createElement('option');
                    option.value = pos;
                    option.textContent = `U${pos}${itemUnits > 1 ? ` (spans U${pos}-U${pos + itemUnits - 1})` : ''}`;
                    if (pos.toString() === currentSelection) {
                        option.selected = true;
                    }
                    positionSelect.appendChild(option);
                });
            }
        }

                rack.siteId ? store.getSites().then(s => s.find(site => site.id === rack.siteId)) : Promise.resolve(null),
                store.getEquipment() // Get all equipment to find line cards
            ]);
            
            // Build occupancy map
            const occupiedUnits = new Map();

            [...equipment, ...fdps].forEach(item => {
                const pos = parseInt(item.rackPosition || item.ruPosition);
                const units = parseInt(item.rackUnits || item.ruSize) || 1;
                const isFdp = fdps.includes(item);
                
                if (pos && !isNaN(pos)) {
                    totalUsedUnits += units;
                    for (let i = 0; i < units; i++) {

        async function updateNniEquipmentPorts() {
            const equipmentId = document.getElementById('nniEquipmentSelect').value;
            const portsGroup = document.getElementById('nniEquipmentPortsGroup');
            const portsSelect = document.getElementById('nniEquipmentPortsSelect');
            
            if (!equipmentId) {
                portsGroup.style.display = 'none';
                return;
            }
            
            const equipment = (await store.getEquipment()).find(e => e.id === equipmentId);
            const allNnis = await store.getNnis();
            const currentNniId = editingNniId;
            
            // Get used ports from other NNIs
            const usedPorts = allNnis
                .filter(n => n.equipmentID === equipmentId && n.id !== currentNniId)
                .flatMap(n => (n.equipmentPorts || '').split(',').map(p => p.trim()))
                .filter(Boolean);
            
            // Parse equipment portConfig to generate port list
            let ports = [];
            if (equipment && equipment.portConfig) {
                const config = equipment.portConfig;
                
                // Check if already has explicit port names like "Gi0/0/1-48"
                if (config.includes('Gi') || config.includes('Te') || config.includes('Fa') || config.includes('Et')) {
                    // Already has port names - extract them
                    const matches = config.match(/[A-Z][a-z]+\d+\/\d+\/\d+(-\d+)?/g);
                    if (matches) {
                        matches.forEach(match => {
                            if (match.includes('-')) {
                                const [base, range] = match.split('-');
                                const [prefix, ...parts] = base.split('/');
                                const start = parseInt(parts[parts.length - 1]);
                                const end = parseInt(range);
                                for (let i = start; i <= end; i++) {
                                    const newParts = [...parts];
                                    newParts[newParts.length - 1] = i;
                                    ports.push(`${prefix}/${newParts.join('/')}`);
                                }
                            } else {
                                ports.push(match);
                            }
                        });
                    }
                } else {
                    // Parse count-based format like "40x1G/10G/25G, 6x100G"
                    // Find all patterns of "NUMBERx" with optional speed info after
                    const portGroups = config.match(/(\d+)x\s*([^,]+)/gi) || [];
                    
                    let portNum = 1;
                    portGroups.forEach(group => {
                        const countMatch = group.match(/(\d+)x/i);
                        const speedMatch = group.match(/x\s*([^,]+)/i);
                        
                        if (countMatch) {
                            const count = parseInt(countMatch[1]);
                            const speed = speedMatch ? speedMatch[1].trim() : '';
                            
                            // Generate port names with speed indicator
                            for (let i = 0; i < count; i++) {
                                ports.push(`Port ${portNum} (${speed})`);
                                portNum++;
                            }
                        }
                    });
                }
            }
            
            // If no ports parsed, generate generic list
            if (ports.length === 0) {
                for (let i = 1; i <= 48; i++) {
                    ports.push(`Port ${i}`);
                }
            }
            
            // Filter out used ports
            const availablePorts = ports.filter(p => !usedPorts.includes(p));
            
            // Populate dropdown
            portsSelect.innerHTML = availablePorts.length > 0 
                ? availablePorts.map(p => `<option value="${p}">${p}</option>`).join('')
                : '<option value="">No available ports</option>';
            
            portsGroup.style.display = 'block';
        }
        
        async function updateNniFdpPorts() {
            const fdpId = document.getElementById('nniFdpSelect').value;
            const portsGroup = document.getElementById('nniFdpPortsGroup');
            const portsSelect = document.getElementById('nniFdpPortsSelect');
            
            if (!fdpId) {

                return;
            }
            
            const fdp = (await store.getFdps()).find(f => f.id === fdpId);
            const allNnis = await store.getNnis();
            const allCircuits = await store.getCircuits();
            const currentNniId = editingNniId;
            
            // Get used ports from other NNIs
            const usedByNnis = allNnis
                .filter(n => n.fdpId === fdpId && n.id !== currentNniId)
                .flatMap(n => (n.fdpPorts || '').split(',').map(p => p.trim()))
                .filter(Boolean);
            
            // Get used ports from circuits
            const usedByCircuits = allCircuits
                .filter(c => c.aFdp === fdpId || c.zFdp === fdpId)
                .flatMap(c => [c.aPort, c.zPort].filter(Boolean));
            
            const usedPorts = [...new Set([...usedByNnis, ...usedByCircuits])];
            
            // Generate port list based on FDP port count
            const portCount = fdp ? (fdp.portCount || 24) : 24;
            const ports = [];
            for (let i = 1; i <= portCount; i++) {
                ports.push(i.toString());
            }
            
            // Filter out used ports
            const availablePorts = ports.filter(p => !usedPorts.includes(p));
            
            // Populate dropdown
            portsSelect.innerHTML = availablePorts.length > 0
                ? availablePorts.map(p => `<option value="${p}">${p}${usedPorts.includes(p) ? ' (In Use)' : ''}</option>`).join('')
                : '<option value="">No available ports</option>';
            
            portsGroup.style.display = 'block';
        }

        async function performGlobalSearch(searchTerm) {
            const resultsDiv = document.getElementById('globalSearchResults');
            
            if (!searchTerm || searchTerm.trim().length < 2) {
                resultsDiv.innerHTML = `
                    <div style="text-align: center; padding: 4rem; color: var(--text-secondary);">
                        <p style="font-size: 1.2rem;">Type at least 2 characters to search...</p>
                    </div>
                `;
                return;
            }
            
            const term = searchTerm.toLowerCase();
            
            try {
                // Get all data
                const [sites, racks, equipment, fdps, circuits, nnis] = await Promise.all([
                    store.getSites(),
                    store.getRacks(),
                    store.getEquipment(),
                    store.getFdps(),
                    store.getCircuits(),
                    store.getNnis()
                ]);
                
                // Search each entity type
                const siteResults = sites.filter(s => 
                    [s.name, s.cidCode, s.location, s.city, s.state, s.contact].some(v => v && v.toLowerCase().includes(term))
                );
                
                const rackResults = racks.filter(r => 
                    [r.name, r.location, sites.find(s => s.id === r.siteId)?.name].some(v => v && v.toLowerCase().includes(term))
                );
                
                const equipmentResults = equipment.filter(e => 
                    [e.name, e.manufacturer, e.model, e.type, e.serialNumber, sites.find(s => s.id === e.siteId)?.name].some(v => v && v.toLowerCase().includes(term))
                );
                
                const fdpResults = fdps.filter(f => 
                    [f.name, f.mountingType, f.connectorType, sites.find(s => s.id === f.siteId)?.name].some(v => v && v.toLowerCase().includes(term))
                );
                
                const circuitResults = circuits.filter(c => 
                    [c.circuitId, c.type, c.direction, c.status, c.provider].some(v => v && v.toLowerCase().includes(term))
                );
                
                const nniResults = nnis.filter(n => 
                    [n.name, n.direction, n.equipmentID, n.fdpId, n.contact, sites.find(s => s.id === n.siteId)?.name].some(v => v && v.toLowerCase().includes(term))
                );
                
                const totalResults = siteResults.length + rackResults.length + equipmentResults.length + fdpResults.length + circuitResults.length + nniResults.length;
                
                if (totalResults === 0) {
                    resultsDiv.innerHTML = `
                        <div style="text-align: center; padding: 4rem; color: var(--text-secondary);">
                            <p style="font-size: 1.2rem;">No results found for "${searchTerm}"</p>
                            <p style="margin-top: 0.5rem;">Try different keywords or check spelling</p>
                        </div>
                    `;
                    return;

        // Smart port configuration parser
        function parsePortConfig(portConfig) {
            if (!portConfig || typeof portConfig !== 'string') {
                return { total: 0, parsed: false };
            }
            
            // Parse formats like: "40x1G/10G/25G, 6X100G" or "48 x 1G" or "24x10G, 2x40G"
            // Extract all "NUMBERxSPEED" patterns
            const regex = /(\d+)\s*[xX×]\s*[\d.]+[GMK]?/gi;
            const matches = portConfig.match(regex);
            
            if (!matches || matches.length === 0) {
                // Try simple number at start: "48" or "48 ports"
                const simpleMatch = portConfig.match(/^(\d+)/);
                if (simpleMatch) {
                    return { total: parseInt(simpleMatch[1]), parsed: true };
                }
                return { total: 0, parsed: false };
            }
            
            // Sum all port counts
            let total = 0;
            matches.forEach(match => {
                const numMatch = match.match(/(\d+)/);
                if (numMatch) {
                    total += parseInt(numMatch[1]);
                }
            });
            
            return { total, parsed: true };
        }

        // Alternating palette so adjacent segments are always visually distinct
        // (red is reserved for the OTDR fault marker)
        const SEGMENT_COLORS = ['#3b82f6', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6', '#06b6d4'];

        function runOtdrPinpoint() {
            const data = window._otdrRouteData;
            const resultEl = document.getElementById('otdrResult');
            const marker = document.getElementById('otdrMarker');
            const markerLabel = document.getElementById('otdrMarkerLabel');
            if (!data || !resultEl || !marker) return;

            const showError = (msg) => {
                resultEl.style.display = 'block';
                resultEl.style.background = 'rgba(239, 68, 68, 0.1)';
                resultEl.style.border = '1px solid #ef4444';
                resultEl.innerHTML = msg;
                marker.style.display = 'none';
            };

            const raw = parseFloat(document.getElementById('otdrDistanceInput').value);
            const unit = document.getElementById('otdrUnitSelect').value;
            if (isNaN(raw) || raw < 0) {
                showError('⚠️ Enter a valid distance value.');
                return;
            }

            // Convert input to km
            let measured = raw;
            if (unit === 'ft') measured = raw / 3280.84;
            if (unit === 'mi') measured = raw * 1.609344;

            // Reference point (route end or segment boundary) and shot direction
            const refSelect = document.getElementById('otdrRefSelect');
            const dirSelect = document.getElementById('otdrDirSelect');
            const refKm = refSelect ? parseFloat(refSelect.value) || 0 : 0;
            const refLabel = refSelect ? refSelect.options[refSelect.selectedIndex].text.replace(/ — .*$/, '') : 'A-End';
            const dir = dirSelect ? dirSelect.value : 'z';
            const dirLabel = dir === 'z' ? `toward ${data.zLocation}` : `toward ${data.aLocation}`;
            const km = refKm + (dir === 'z' ? measured : -measured);

            const totalKm = data.totalKm;
            const ftStr = Math.round(measured * 3280.84).toLocaleString();
            const miStr = (measured / 1.609344).toFixed(2);
            const shotDesc = `<strong>${measured.toFixed(2)} km</strong> (${ftStr} ft / ${miStr} mi) measured from <strong>${refLabel}</strong> ${dirLabel}`;

            if (!totalKm || totalKm <= 0) {
                showError('⚠️ This route has no segment distances entered, so the fault location cannot be mapped.');
                return;
            }

            if (km < 0) {
                marker.style.left = '0%';
                marker.style.display = 'block';
                markerLabel.textContent = '< 0 km';
                showError(`⚠️ ${shotDesc} lands <strong>${Math.abs(km).toFixed(2)} km past ${data.aLocation}</strong> — off the A-end of this route. ` +
                    `Check the shot direction, or the OTDR reading includes slack/launch fiber. Marker pinned at route start.`);
                marker.style.display = 'block';
                return;
            }

            if (km > totalKm) {
                marker.style.left = '100%';
                marker.style.display = 'block';
                markerLabel.textContent = km.toFixed(2) + ' km';
                showError(`⚠️ ${shotDesc} lands <strong>${(km - totalKm).toFixed(2)} km past ${data.zLocation}</strong> — beyond the route's ${totalKm.toFixed(2)} km total. ` +
                    `Check the shot direction, or the OTDR reading includes slack/launch fiber not in the as-built distances. Marker pinned at route end.`);
                marker.style.display = 'block';
                return;
            }

            // Walk segments to find where the fault lands
            let cum = 0, found = null, segStart = 0, colorIdx = 0;
            for (let i = 0; i < data.segments.length; i++) {
                const s = data.segments[i];
                if (km <= cum + s.km || i === data.segments.length - 1) {
                    found = s; segStart = cum; colorIdx = i;
                    break;
                }
                cum += s.km;
            }

            const intoSeg = km - segStart;
            const segEnd = segStart + found.km;
            const remaining = totalKm - km;
            const pct = Math.min((km / totalKm) * 100, 100);

            marker.style.left = pct.toFixed(3) + '%';
            marker.style.display = 'block';
            markerLabel.textContent = km.toFixed(2) + ' km';

            const segColor = SEGMENT_COLORS[colorIdx % SEGMENT_COLORS.length];
            resultEl.style.display = 'block';
            resultEl.style.background = 'rgba(16, 185, 129, 0.08)';
            resultEl.style.border = '1px solid ' + segColor;
            resultEl.innerHTML =
                `📍 ${shotDesc} lands at <strong>${km.toFixed(2)} km</strong> from ${data.aLocation}, in ` +
                `<span style="color: ${segColor}; font-weight: 700;">Segment ${found.order}: ${found.provider}</span>` +
                ` (${found.ownership || 'Unknown'}${found.name ? ' — ' + found.name : ''})<br>` +
                `↳ <strong>${intoSeg.toFixed(2)} km</strong> into this segment from its A-side (segment spans ${segStart.toFixed(2)}–${segEnd.toFixed(2)} km) · ` +
                `${(segEnd - km).toFixed(2)} km to the segment's Z-side · ${remaining.toFixed(2)} km to ${data.zLocation}` +
                `<br><span style="font-size: 0.8rem; color: var(--text-tertiary);">Note: OTDR measures optical fiber length (includes slack loops & launch fiber), so the physical fault may be slightly before this point.</span>`;
        }

        async function deleteDarkFiberRoute(routeId) {
            if (!confirm('Delete this dark fiber route and all its segments? This cannot be undone.')) return;
            
            try {
                // Delete segments first
                const segments = await store.getDarkFiberSegments();
                const routeSegments = segments.filter(s => s.routeId === routeId);
                for (const segment of routeSegments) {
                    await store.deleteDarkFiberSegment(segment.id);
                }
                
                // Then delete route
                await store.deleteDarkFiberRoute(routeId);
                alert('Route and segments deleted successfully!');
                await renderDarkFiberPage();
            } catch (error) {
                console.error('Delete error:', error);
                alert('Error deleting route: ' + error.message);
            }
        }

        // Segment CRUD Functions

            console.log('📋 Opening Add Segment modal for route:', routeId);

                initializeModals();

            editingDarkFiberSegmentId = null;
            currentViewingRouteId = routeId;
            document.getElementById('darkFiberSegmentModalTitle').textContent = 'Add Segment';
            const form = document.getElementById('darkFiberSegmentForm');
            form.reset();
            
            // Auto-suggest next segment number
            store.getDarkFiberSegments().then(segments => {
                const routeSegments = segments.filter(s => s.routeId === routeId);
                const maxOrder = routeSegments.length > 0 ? Math.max(...routeSegments.map(s => s.segmentOrder || 0)) : 0;
                form.elements.segmentOrder.value = maxOrder + 1;
            });
            
            document.getElementById('darkFiberSegmentModal').classList.add('active');
        }
        
        function closeDarkFiberSegmentModal() {
            document.getElementById('darkFiberSegmentModal').classList.remove('active');

            const segments = await store.getDarkFiberSegments();
            const segment = segments.find(s => s.id === segmentId);

            editingDarkFiberSegmentId = segmentId;
            currentViewingRouteId = segment.routeId;
            document.getElementById('darkFiberSegmentModalTitle').textContent = 'Edit Segment';
            const form = document.getElementById('darkFiberSegmentForm');
            
            form.elements.segmentOrder.value = segment.segmentOrder || '';
            form.elements.segmentName.value = segment.segmentName || '';
            form.elements.ownershipType.value = segment.ownershipType || '';
            form.elements.usageType.value = segment.usageType || '';
            form.elements.providerName.value = segment.providerName || '';
            form.elements.customerName.value = segment.customerName || '';
            form.elements.distance.value = segment.distance || '';
            form.elements.strandNumbers.value = segment.strandNumbers || '';
            form.elements.fiberType.value = segment.fiberType || '';
            form.elements.fiberCount.value = segment.fiberCount || '';
            form.elements.aEndLocation.value = segment.aEndLocation || '';
            form.elements.aEndConnectionType.value = segment.aEndConnectionType || '';
            form.elements.aEndFDP.value = segment.aEndFDP || '';
            form.elements.aEndPort.value = segment.aEndPort || '';
            form.elements.aEndEquipment.value = segment.aEndEquipment || '';
            form.elements.zEndLocation.value = segment.zEndLocation || '';

            handleOwnershipChange(segment.ownershipType);

        async function saveDarkFiberSegment(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            
            const segment = {
                routeId: currentViewingRouteId,
                segmentOrder: parseInt(formData.get('segmentOrder')),
                segmentName: formData.get('segmentName'),
                ownershipType: formData.get('ownershipType'),
                usageType: formData.get('usageType'),
                providerName: formData.get('providerName'),
                customerName: formData.get('customerName'),
                distance: parseFloat(formData.get('distance')),
                strandNumbers: formData.get('strandNumbers'),
                fiberType: formData.get('fiberType'),
                fiberCount: formData.get('fiberCount') ? parseInt(formData.get('fiberCount')) : null,
                aEndLocation: formData.get('aEndLocation'),
                aEndConnectionType: formData.get('aEndConnectionType'),
                aEndFDP: formData.get('aEndFDP'),
                aEndPort: formData.get('aEndPort'),
                aEndEquipment: formData.get('aEndEquipment'),
                zEndLocation: formData.get('zEndLocation'),
                zEndConnectionType: formData.get('zEndConnectionType'),
                zEndFDP: formData.get('zEndFDP'),
                zEndPort: formData.get('zEndPort'),
                zEndEquipment: formData.get('zEndEquipment'),
                providerCircuitID: formData.get('providerCircuitID'),
                notes: formData.get('notes')
            };
            
            // Auto-set provider name for owned fiber
            if (segment.ownershipType === 'Owned' && !segment.providerName) {
                segment.providerName = 'IRIS Networks';
            }
            
            try {
                if (editingDarkFiberSegmentId) {
                    await store.updateDarkFiberSegment(editingDarkFiberSegmentId, segment);
                    alert('Segment updated successfully!');
                } else {
                    await store.addDarkFiberSegment(segment);
                    alert('Segment added successfully!');
                }
                closeDarkFiberSegmentModal();
                await viewDarkFiberRoute(currentViewingRouteId);
            } catch (error) {
                console.error('Save error:', error);
                alert('Error saving segment: ' + error.message);
            }
        }
        
        async function deleteDarkFiberSegment(segmentId) {
            if (!confirm('Delete this segment? This cannot be undone.')) return;
            
            try {
                const segments = await store.getDarkFiberSegments();
                const segment = segments.find(s => s.id === segmentId);
                await store.deleteDarkFiberSegment(segmentId);
                alert('Segment deleted successfully!');
                await viewDarkFiberRoute(segment.routeId);
            } catch (error) {
                console.error('Delete error:', error);
                alert('Error deleting segment: ' + error.message);
            }
        }
        
        // Form helper functions
        function handleOwnershipChange(value) {
            const providerGroup = document.getElementById('providerNameGroup');
            const form = document.getElementById('darkFiberSegmentForm');
            
            if (value === 'Owned') {
                if (providerGroup) providerGroup.style.display = 'block';
                if (form && form.elements.providerName) {
                    form.elements.providerName.value = 'IRIS Networks';
                    form.elements.providerName.readOnly = true;
                    form.elements.providerName.style.background = 'var(--bg-tertiary)';

            } else {

                        form.elements.providerName.value = '';
                    }
                    form.elements.providerName.readOnly = false;
                    form.elements.providerName.style.background = '';
                }
            }

        }
        
        async function renderAvailablePortsPage() {
            const content = document.getElementById('content');
            
            try {
                // Load all data
                const [sites, equipment, fdps, circuits, nnis] = await Promise.all([
                    store.getSites(),
                    store.getEquipment(),
                    store.getFdps(),
                    store.getCircuits(),
                    store.getNnis()
                ]);
                
                // Calculate port utilization for all equipment
                const equipmentStats = equipment.map(equip => {
                    const site = sites.find(s => s.id === equip.siteId);
                    
                    // Parse port configuration to get total ports
                    const portInfo = parsePortConfig(equip.portConfig);
                    const totalPorts = portInfo.total;
                    const hasPortConfig = portInfo.parsed;
                    
                    // Find circuits using this equipment
                    const equipCircuits = circuits.filter(c => 
                        c.aEquipment === equip.id || c.zEquipment === equip.id
                    );
                    
                    // Find NNIs using this equipment
                    const equipNnis = nnis.filter(n => n.equipmentID === equip.id);
                    
                    // Count used ports (rough estimate - each circuit/NNI uses 1+ ports)
                    const usedPorts = equipCircuits.length + equipNnis.length;
                    const availablePorts = Math.max(0, totalPorts - usedPorts);
                    const utilization = totalPorts > 0 ? ((usedPorts / totalPorts) * 100).toFixed(1) : 0;
                    
                    return {
                        id: equip.id,
                        name: equip.name,
                        type: 'Equipment',
                        siteName: site ? site.name : 'Unknown',
                        siteId: site ? site.id : null,
                        totalPorts,
                        usedPorts,
                        availablePorts,
                        utilization: parseFloat(utilization),
                        circuits: equipCircuits.length,
                        nnis: equipNnis.length,
                        hasPortConfig,
                        portConfigText: equip.portConfig || 'Not configured'
                    };
                }); // Show ALL equipment, even without ports configured
                
                // Calculate port utilization for all FDPs
                const fdpStats = fdps.map(fdp => {
                    const site = sites.find(s => s.id === fdp.siteId);
                    const totalPorts = fdp.portCount || 0;
                    
                    // Find circuits using this FDP
                    const fdpCircuits = circuits.filter(c => 
                        c.aFdp === fdp.id || c.zFdp === fdp.id ||
                        c.aEquipmentFdp === fdp.id || c.zEquipmentFdp === fdp.id
                    );
                    
                    // Find NNIs using this FDP
                    const fdpNnis = nnis.filter(n => n.fdpId === fdp.id);
                    
                    const usedPorts = fdpCircuits.length + fdpNnis.length;
                    const availablePorts = Math.max(0, totalPorts - usedPorts);
                    const utilization = totalPorts > 0 ? ((usedPorts / totalPorts) * 100).toFixed(1) : 0;
                    
                    return {
                        id: fdp.id,
                        name: fdp.name,
                        type: 'FDP',
                        siteName: site ? site.name : 'Unknown',

                        usedPorts,
                        availablePorts,

                const totalEquipmentAvailable = enhancedEquipmentStats.reduce((sum, item) => sum + item.availablePorts, 0);
