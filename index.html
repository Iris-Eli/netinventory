        async function saveFdp(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const fdp = {
                name: formData.get('name'),
                siteId: formData.get('siteId'),
                mountingType: formData.get('mountingType'),
                location: formData.get('location') || '',
                connectorType: formData.get('connectorType') || '',
                type: formData.get('type') || '',
                soNumber: formData.get('soNumber') || '', notes: formData.get('notes') || ''
            };
            
            // Only include rack-related fields if rack is selected
            if (formData.get('rackId')) {
                fdp.rackId = formData.get('rackId');
                if (formData.get('ruSize')) {
                    fdp.rackUnits = parseInt(formData.get('ruSize'));
                }
                if (formData.get('ruPosition')) {
                    fdp.rackPosition = parseInt(formData.get('ruPosition'));
                }
            } else {
                fdp.rackId = '';
            }
            
            // Only include portCount if provided
            if (formData.get('portCount')) {
                fdp.portCount = parseInt(formData.get('portCount'));
            }
            
            // RU conflict check (guards against stale dropdowns & simultaneous multi-user edits)
            if (fdp.rackId && fdp.rackPosition) {
                const check = await validateRackPosition(fdp.rackId, fdp.rackPosition, fdp.rackUnits || 1, editingFdpId);
                if (!check.valid) {
                    const c = check.conflictingItem;
                    alert(`⚠️ Rack position conflict!\n\nU${fdp.rackPosition}${(fdp.rackUnits || 1) > 1 ? `–U${fdp.rackPosition + fdp.rackUnits - 1}` : ''} overlaps with "${c.name}" (U${c.rackPosition || c.ruPosition}, ${c.rackUnits || c.ruSize || 1}U).` +
                        (check.suggestion ? `\n\nNext available position for this size: U${check.suggestion}` : '\n\nNo positions available in this rack for this size.'));
                    return;
                }
            }
            
            if (!(await confirmIfDuplicate('getFdps', 'name', fdp.name, editingFdpId, 'FDP named'))) return;
            try {
                if (editingFdpId) {
                    await store.updateFdp(editingFdpId, fdp);
                    alert('FDP updated successfully!');
                } else {
                    await store.addFdp(fdp);
                    alert('FDP added successfully!');
                }
                closeFdpModal();
                await renderFdpsPage();
            } catch (error) {
                console.error('Save error:', error);
                alert('Error saving FDP: ' + friendlyError(error));
            }
        }

        // Check if NNI subinterface is already in use
        async function checkNniSubinterfaceDuplicate(end) {
            const nniSelectId = end === 'a' ? 'aNniSelect' : 'zNniSelect';
            const subinterfaceInputId = end === 'a' ? 'aNniSubinterface' : 'zNniSubinterface';
            const warningId = end === 'a' ? 'aNniSubinterfaceWarning' : 'zNniSubinterfaceWarning';
            
            const nniSelect = document.getElementById(nniSelectId);
            const subinterfaceInput = document.getElementById(subinterfaceInputId);
            const warning = document.getElementById(warningId);
            
            if (!nniSelect || !subinterfaceInput || !warning) return;
            
            const selectedNniId = nniSelect.value;
            const enteredSubinterface = subinterfaceInput.value.trim();
            
            // Hide warning if no NNI selected or no subinterface entered
            if (!selectedNniId || !enteredSubinterface) {
                warning.style.display = 'none';
                return;
            }
            
            // Normalize the entered subinterface for comparison
            const normalizedEntered = normalizeSubinterface(enteredSubinterface);
            
            // Get all circuits
            const circuits = await store.getCircuits();
            
            // Check if any circuit uses this NNI with the same subinterface
            const isDuplicate = circuits.some(circuit => {
                // Skip if this is the circuit we're editing
                if (editingCircuitId && circuit.id === editingCircuitId) return false;
                
                // Check A-end
                if (circuit.aNni === selectedNniId && circuit.aNniSubinterface) {
                    const circuitNormalized = normalizeSubinterface(circuit.aNniSubinterface);
                    if (circuitNormalized === normalizedEntered) return true;
                }
                
                // Check Z-end
                if (circuit.zNni === selectedNniId && circuit.zNniSubinterface) {
                    const circuitNormalized = normalizeSubinterface(circuit.zNniSubinterface);
                    if (circuitNormalized === normalizedEntered) return true;
                }
                
                return false;
            });
            
            // Show/hide warning based on duplicate check
            warning.style.display = isDuplicate ? 'block' : 'none';
        }

            if (!container) return;
            
            // Clear existing additional VLANs
            container.innerHTML = '';
            
            // If only 1 VLAN, no additional sections needed
            if (vlanCount === 1) return;
            
            // Generate additional VLAN sections (2 through vlanCount)
            for (let i = 2; i <= vlanCount; i++) {
                const vlanHTML = await generateVlanSectionHTML(i);
                container.innerHTML += vlanHTML;

            // After sections are added, populate dropdowns for each VLAN

        // Populate equipment ports when equipment is selected in circuit form
        // Platform interface naming: 100G+ ports carry a /1 lane suffix (Arista convention);
        // breakout ports would be /1-/4 — engineer adjusts in the CFA grid for those.
        function interfaceNameForPort(portNum, speed) {
            return /(100|400|800)\s*G/i.test(speed || '') ? `ET${portNum}/1` : `ET${portNum}`;
        }
        function interfaceNameFromEquip(equip, portNum) {
            if (!equip || !equip.portConfig) return `ET${portNum}`;
            let cur = 1;
            for (const seg of String(equip.portConfig).split(',')) {
                const m = seg.trim().match(/(\d+)\s*x\s*(.+)/i);
                if (!m) continue;
                const count = parseInt(m[1]);
                if (portNum >= cur && portNum < cur + count) return interfaceNameForPort(portNum, m[2]);
                cur += count;
            }
            return `ET${portNum}`;
        }

        // ===== CFA/DLR path grid =====
        let _cfaEquipOptions = '';
        function addCfaPathRow(data = {}) {
            const wrap = document.getElementById('cfaPathRows');
            if (!wrap) return;
            // Prefill from the circuit form's A/Z selections when adding a fresh row
            if (!data.aDevice && !data.zDevice) {
                try {
                    const aSel = document.getElementById('aEquipmentSelect');
                    const zSel = document.getElementById('zEquipmentSelect');
                    if (aSel && aSel.value) data.aDevice = aSel.options[aSel.selectedIndex].text;
                    if (zSel && zSel.value) data.zDevice = zSel.options[zSel.selectedIndex].text;
                    const aPort = document.getElementById('aEquipmentPortSelect');
                    const zPort = document.getElementById('zEquipmentPortSelect');
                    const grab = sel => sel && sel.selectedOptions && sel.selectedOptions.length ? sel.selectedOptions[0] : null;
                    const aOpt = grab(aPort), zOpt = grab(zPort);
                    // Interface name is embedded in the option label: "Port 43 — ET43/1 (100G)…"
                    const fromLabel = opt => { const m = opt && opt.textContent.match(/—\s*(ET\S+)\s*\(/); return m ? m[1] : ''; };
                    if (aOpt && !data.aInterface) data.aInterface = fromLabel(aOpt);
                    if (zOpt && !data.zInterface) data.zInterface = fromLabel(zOpt);
                    const vlanField = document.querySelector('#circuitForm [name="wavelength"]');
                } catch (e) { /* prefill is best-effort */ }
            }
            const i = wrap.children.length;
            const row = document.createElement('div');
            row.className = 'cfa-path-row';
            row.style.cssText = 'display: grid; grid-template-columns: 70px 1fr 90px 70px 1fr 90px 60px 30px; gap: 0.4rem; margin-bottom: 0.4rem; align-items: center;';
            row.innerHTML = `
                <input type="text" placeholder="VLAN" value="${data.vlan || ''}" data-cfa="vlan" style="padding: 0.4rem;">
                <select data-cfa="aDevice" style="padding: 0.4rem;">${_cfaEquipOptions}</select>
                <input type="text" placeholder="ET43/1" value="${data.aInterface || ''}" data-cfa="aInterface" style="padding: 0.4rem;">
                <input type="text" value="${data.transport || 'VPWS'}" data-cfa="transport" style="padding: 0.4rem;">
                <select data-cfa="zDevice" style="padding: 0.4rem;">${_cfaEquipOptions}</select>
                <input type="text" placeholder="ET44/1" value="${data.zInterface || ''}" data-cfa="zInterface" style="padding: 0.4rem;">
                <label style="display: flex; align-items: center; gap: 0.2rem; font-size: 0.75rem;"><input type="checkbox" data-cfa="isMgmt" ${data.isMgmt ? 'checked' : ''} style="width: auto;">mgmt</label>
                <button type="button" onclick="this.parentElement.remove()" style="background: none; border: none; cursor: pointer; color: var(--accent-danger);">✕</button>`;
            wrap.appendChild(row);
            if (data.aDevice) row.querySelector('[data-cfa="aDevice"]').value = data.aDevice;
            if (data.zDevice) row.querySelector('[data-cfa="zDevice"]').value = data.zDevice;
            // Interface smart defaults on device pick
            ['a', 'z'].forEach(side => {
                row.querySelector(`[data-cfa="${side}Device"]`).addEventListener('change', async (e) => {
                    const intfEl = row.querySelector(`[data-cfa="${side}Interface"]`);
                    if (intfEl.value) return;
                    const eq = (await store.getEquipment()).find(x => x.name === e.target.value);
                    if (eq) intfEl.placeholder = 'ET<port>' + (/(100|400|800)G/.test(eq.portConfig || '') ? '/1' : '');
                });
            });
        }
        function collectCfaPaths() {
            return Array.from(document.querySelectorAll('#cfaPathRows .cfa-path-row')).map(row => {
                const get = k => { const el = row.querySelector(`[data-cfa="${k}"]`); return el.type === 'checkbox' ? el.checked : el.value.trim(); };
                return { vlan: get('vlan'), aDevice: get('aDevice'), aInterface: get('aInterface'), transport: get('transport') || 'VPWS', zDevice: get('zDevice'), zInterface: get('zInterface'), isMgmt: get('isMgmt') };
            }).filter(p => p.vlan || p.aDevice || p.zDevice);
        }
        function generateCfaText(paths, cpe, circuit) {
            const blocks = [];
            paths.forEach(p => {
                const header = p.isMgmt ? `Shared MGMT VLAN ${p.vlan}` : `VLAN ${p.vlan}`;
                const lines = [header];
                if (p.aDevice) lines.push(`${p.aDevice} ${p.aInterface || ''}${p.aInterface && p.vlan ? '.' + p.vlan : ''}`.trim());
                lines.push(p.transport || 'VPWS');
                if (p.zDevice) lines.push(`${p.zDevice} ${p.zInterface || ''}${p.zInterface && p.vlan ? '.' + p.vlan : ''}`.trim());
                blocks.push(lines.join('\n'));
            });
            if (cpe) {
                const cpeLines = [cpe.model || 'CPE'];
                // Port roles from CPE port notes embedded in equipment notes are out of scope v1; engineers add via notes
                if (circuit.cpeMgmtIp || cpe.mgmtIp) cpeLines.push(`MGMT IP: ${circuit.cpeMgmtIp || cpe.mgmtIp}`);
                if (circuit.cpeMgmtGateway || cpe.mgmtGateway) cpeLines.push(`MGMT GW: ${circuit.cpeMgmtGateway || cpe.mgmtGateway}`);
                if (circuit.cpeMgmtSubnet || cpe.mgmtSubnet) cpeLines.push(`MGMT Subnet: ${circuit.cpeMgmtSubnet || cpe.mgmtSubnet}`);
                blocks.push(cpeLines.join('\n'));
            }
            return blocks.join('\n\n');
        }

        // ============ TEMPLATE SYNC: push template spec changes to existing equipment ============
        // Updates SPEC fields (port layout, line ports, RU, power specs) on every piece
        // of equipment matching the template's manufacturer+model. Per-device fields
        // (provisioned line capacity, wavelength, serial, mgmt IP, rack position) are never touched.
        const TEMPLATE_SYNC_FIELDS = ['portConfig', 'linePorts', 'rackUnits', 'powerType', 'voltage', 'maxPowerDraw', 'weight'];

        async function syncTemplateToEquipment(templateId) {
            try {
                const [templates, equipment] = await Promise.all([store.getTemplates(), store.getEquipment()]);
                const t = templates.find(x => x.id === templateId);
                if (!t) { alert('Template not found'); return; }
                const matches = equipment.filter(e =>
                    String(e.manufacturer || '').trim().toLowerCase() === String(t.manufacturer || '').trim().toLowerCase() &&
                    String(e.model || '').trim().toLowerCase() === String(t.model || '').trim().toLowerCase()
                );
                if (matches.length === 0) {
                    alert(`No equipment found matching ${t.manufacturer} ${t.model}.`);
                    return;
                }
                // Diff: which devices actually differ from the template specs?
                const toUpdate = [];
                matches.forEach(e => {
                    const changes = {};
                    TEMPLATE_SYNC_FIELDS.forEach(f => {
                        const tv = t[f];
                        if (tv === undefined || tv === null || tv === '') return;  // template silent on this field
                        const ev = e[f];
                        const tvs = (f === 'rackUnits' || f === 'weight' || f === 'maxPowerDraw') ? String(parseInt(tv)) : String(tv);
                        const evs = ev === undefined || ev === null ? '' : String(ev);
                        if (tvs !== evs) changes[f] = (f === 'rackUnits' || f === 'weight') ? parseInt(tv) : ((f === 'maxPowerDraw' && e.maxPowerDraw !== undefined) ? String(tv) : tv);
                    });
                    if (Object.keys(changes).length > 0) toUpdate.push({ e, changes });
                });
                if (toUpdate.length === 0) {
                    alert(`✅ All ${matches.length} ${t.model} device(s) already match the template.`);
                    return;
                }
                const fieldList = [...new Set(toUpdate.flatMap(u => Object.keys(u.changes)))].join(', ');
                const deviceList = toUpdate.slice(0, 12).map(u => u.e.name).join('\n  ') + (toUpdate.length > 12 ? `\n  …and ${toUpdate.length - 12} more` : '');
                if (!confirm(`↻ Sync template "${t.name}" to equipment?\n\n${toUpdate.length} of ${matches.length} ${t.model} device(s) will be updated.\nFields: ${fieldList}\n\nDevices:\n  ${deviceList}\n\nPer-device data (line capacity, wavelength, serial, rack position) is NOT touched.`)) return;
                
                let done = 0, failed = 0;
                for (const u of toUpdate) {
                    try {
                        // maxPowerDraw is TEXT on equipment but NUMBER on templates — convert
                        if (u.changes.maxPowerDraw !== undefined) u.changes.maxPowerDraw = String(u.changes.maxPowerDraw);
                        await store.updateEquipment(u.e.id, u.changes);
                        done++;
                    } catch (err) {
                        console.error('Sync failed for', u.e.name, err);
                        failed++;
                    }
                }
                alert(`✅ Synced ${done} device(s) to template "${t.name}".` + (failed ? `\n❌ ${failed} failed — see console.` : ''));
            } catch (error) {
                alert('Error syncing template: ' + friendlyError(error));
            }
        }

        function pickImportFile() {

        const IMPORT_UPDATE_FIELDS = ['manufacturer','model','type','serialNumber','rackUnits','powerType','powerDraw','maxPowerDraw','voltage','weight','portConfig','linePorts','lineCapacity','slotNumber','mgmtIp','mgmtSubnet','mgmtGateway','installDate','notes'];

        async function validateImportRows(rows) {
            const status = document.getElementById('importStatus');
            const preview = document.getElementById('importPreview');
            const [sites, existingEquipment, templates] = await Promise.all([
                store.getSites(), store.getEquipment(), store.getTemplates().catch(() => [])
            ]);
            const siteByKey = {};
            sites.forEach(s => {
                if (s.name) siteByKey[String(s.name).trim().toLowerCase()] = s;
                siteByKey[String(s.id).trim().toLowerCase()] = s;
            });
            const tmplByName = {};
            templates.forEach(t => { if (t.name) tmplByName[String(t.name).trim().toLowerCase()] = t; });
            const existingNames = new Set(existingEquipment.map(e => String(e.name || '').trim().toLowerCase()));
            const equipByName = {};
            existingEquipment.forEach(e => { if (e.name) equipByName[String(e.name).trim().toLowerCase()] = e; });
            const seenInFile = new Set();
            
            _importRows = rows.map((raw, idx) => {
                const r = {};
                IMPORT_COLUMNS.forEach(c => { r[c] = String(raw[c] !== undefined ? raw[c] : '').trim(); });
                const problems = [];
                let level = 'ok';
                if (!r.name) { problems.push('missing name'); level = 'error'; }
                const site = r.site ? siteByKey[r.site.toLowerCase()] : null;
                if (r.site && !site) { problems.push(`unknown site "${r.site}"`); level = 'error'; }
                else if (!r.site) { problems.push('no site — assign later via Edit'); if (level !== 'error') level = 'warn'; }
                let template = null;
                if (r.template) {
                    template = tmplByName[r.template.toLowerCase()];
                    if (!template) { problems.push(`unknown template "${r.template}"`); level = 'error'; }
                }
                let parent = null;
                if (r.parentName) {
                    parent = equipByName[r.parentName.toLowerCase()];
                    if (!parent) { problems.push(`parent chassis "${r.parentName}" not found — import chassis first`); level = 'error'; }
                }
                const nameKey = r.name.toLowerCase();
                const updateMode = document.getElementById('importUpdateMode') && document.getElementById('importUpdateMode').checked;
                let existing = null, updates = null;
                if (r.name && existingNames.has(nameKey)) {
                    if (!updateMode) { problems.push('already in inventory — skipped (safe re-run)'); level = 'error'; }
                    else {
                        existing = equipByName[nameKey];
                        updates = {};
                        IMPORT_UPDATE_FIELDS.forEach(f => {
                            const cur = existing[f];
                            if (r[f] && (cur === undefined || cur === null || String(cur).trim() === '')) updates[f] = r[f];
                        });
                        if (site && !existing.siteId) updates.siteId = site.id;
                        if (parent && !existing.parentEquipmentID) updates.parentEquipmentID = parent.id;
                        if (Object.keys(updates).length === 0) { problems.push('exists — nothing blank to fill'); level = 'error'; }
                        else { problems.push('UPDATE: ' + Object.keys(updates).join(', ')); if (level !== 'error') level = 'warn'; }
                    }
                }
                if (r.name && seenInFile.has(nameKey)) { problems.push('duplicate within file'); level = 'error'; }
                if (r.name) seenInFile.add(nameKey);
                if (r.rackUnits && isNaN(parseInt(r.rackUnits))) { problems.push('rackUnits not a number'); level = 'error'; }
                if (r.weight && isNaN(parseFloat(r.weight))) { problems.push('weight not a number'); level = 'error'; }
                return { idx: idx + 2, raw: r, site, template, parent, existing, updates, problems, level };
            });
            
            const ok = _importRows.filter(r => r.level === 'ok').length;
            const warn = _importRows.filter(r => r.level === 'warn').length;
            const err = _importRows.filter(r => r.level === 'error').length;
            if (status) status.textContent = '';
            
            preview.innerHTML = `
                <div style="display: flex; gap: 1.5rem; margin-bottom: 0.75rem; font-size: 0.9rem;">
                    <span style="color: var(--success);">✅ ${ok} ready</span>
                    <span style="color: #f59e0b;">⚠️ ${warn} warnings (will import)</span>
                    <span style="color: var(--danger);">❌ ${err} errors (will be skipped)</span>
                </div>
                <div class="table-container" style="max-height: 380px; overflow-y: auto; margin-bottom: 1rem;">
                    <table>
                        <thead><tr><th>Row</th><th></th><th>Name</th><th>Site</th><th>Template</th><th>Model</th><th>Issues</th></tr></thead>
                        <tbody>
                            ${_importRows.map(r => `
                                <tr>
                                    <td>${r.idx}</td>
                                    <td>${r.level === 'ok' ? '✅' : r.level === 'warn' ? '⚠️' : '❌'}</td>
                                    <td><strong>${r.raw.name || '—'}</strong></td>
                                    <td>${r.site ? r.site.name : '<span style="color: var(--danger);">' + (r.raw.site || '—') + '</span>'}</td>
                                    <td>${r.raw.template || ''}</td>
                                    <td>${r.raw.manufacturer || (r.template ? r.template.manufacturer : '')} ${r.raw.model || (r.template ? r.template.model : '')}</td>
                                    <td style="font-size: 0.8rem; color: var(--text-secondary);">${r.problems.join('; ')}</td>
                                </tr>`).join('')}
                        </tbody>
                    </table>
                </div>
                <button class="btn-primary" id="importConfirmBtn" onclick="runEquipmentImport()" ${ok + warn === 0 ? 'disabled' : ''}>
                    Import ${ok + warn} device${ok + warn !== 1 ? 's' : ''}
                </button>`;
        }

        async function runEquipmentImport() {
            if (!_importRows) return;
            const btn = document.getElementById('importConfirmBtn');
            const status = document.getElementById('importStatus');
            const importable = _importRows.filter(r => r.level !== 'error');
            if (btn) { btn.disabled = true; }
            let done = 0, failed = 0;
            for (const r of importable) {
                try {
                    if (r.existing && r.updates) {
                        if (r.updates.rackUnits !== undefined) r.updates.rackUnits = parseInt(r.updates.rackUnits);
                        if (r.updates.weight !== undefined) r.updates.weight = parseInt(r.updates.weight);
                        await store.updateEquipment(r.existing.id, r.updates);
                        done++;
                        if (status) status.textContent = `Importing… ${done + failed}/${importable.length}`;
                        continue;
                    }
                    const t = r.template || {};
                    const pick = (field, tField) => r.raw[field] || t[tField !== undefined ? tField : field] || '';
                    const equip = {
                        name: r.raw.name,
                        siteId: r.site ? r.site.id : '',
                        rackId: '',
                        manufacturer: pick('manufacturer'),
                        model: pick('model'),
                        type: pick('type'),
                        serialNumber: r.raw.serialNumber,
                        powerType: pick('powerType'),
                        powerDraw: r.raw.powerDraw || (t.powerDraw !== undefined && t.powerDraw !== '' ? String(t.powerDraw) : ''),
                        maxPowerDraw: r.raw.maxPowerDraw || (t.maxPowerDraw !== undefined && t.maxPowerDraw !== '' ? String(t.maxPowerDraw) : ''),
                        voltage: pick('voltage'),
                        portConfig: pick('portConfig'),
                        linePorts: pick('linePorts'),
                        lineCapacity: r.raw.lineCapacity || '',
                        parentEquipmentID: r.parent ? r.parent.id : '',
                        slotNumber: r.raw.slotNumber || '',
                        mgmtIp: r.raw.mgmtIp,
                        mgmtSubnet: r.raw.mgmtSubnet,
                        mgmtGateway: r.raw.mgmtGateway,
                        installDate: r.raw.installDate,
                        notes: r.raw.notes
                    };
                    const ru = r.raw.rackUnits || t.rackUnits;
                    if (ru !== '' && ru !== undefined && ru !== null && !isNaN(parseInt(ru))) equip.rackUnits = parseInt(ru);
                    const w = r.raw.weight || t.weight;
                    if (w !== '' && w !== undefined && w !== null && !isNaN(parseFloat(w))) equip.weight = parseInt(w);
                    await store.addEquipment(equip);
                    done++;
                } catch (e) {
                    console.error('Import row ' + r.idx + ' failed:', e);
                    failed++;
                }
                if (status) status.textContent = `Importing… ${done + failed}/${importable.length}`;
            }
            if (status) status.textContent = '';
            alert(`✅ Imported ${done} device(s).` + (failed ? `\n❌ ${failed} failed — see console for details.` : ''));
            closeEquipmentImportModal();
            renderEquipmentPage();
        }

        async function exportAllToExcel(btn) {
            if (typeof XLSX === 'undefined') { alert('Excel library failed to load. Check your internet connection and refresh.'); return; }
            const origText = btn ? btn.textContent : '';
            if (btn) { btn.disabled = true; btn.textContent = '⏳ Exporting...'; }
            try {
                const sections = await _gatherAllData();
                const wb = XLSX.utils.book_new();
                let totalRows = 0;
                sections.forEach(s => {
                    const fields = Object.keys(SHAREPOINT_CONFIG.fieldMappings[s.entity]);
                    const rows = s.items.map(item => {
                        const row = {};
                        fields.forEach(f => {
                            let v = item[f];
                            if (v === null || v === undefined) v = '';
                            if (typeof v === 'object') v = JSON.stringify(v);
                            row[f] = v;
                        });
                        return row;
                    });
                    totalRows += rows.length;
                    const ws = XLSX.utils.json_to_sheet(rows, { header: fields });
                    // Reasonable default column widths
                    ws['!cols'] = fields.map(f => ({ wch: Math.max(f.length + 2, 14) }));
                    XLSX.utils.book_append_sheet(wb, ws, s.sheet);
                });
                XLSX.writeFile(wb, 'NetInventory-Export-' + _exportStamp() + '.xlsx');
                console.log('✅ Exported ' + totalRows + ' rows across ' + sections.length + ' sheets');
            } catch (error) {
                console.error('Export error:', error);
                alert('Error exporting: ' + friendlyError(error));
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = origText; }
            }
        }

        // ============ PORT MAP ZOOM (buttons + pinch) ============
        let _portZoom = 1;
        function setPortZoomAbs(z) {
            _portZoom = Math.min(3, Math.max(0.5, z));
            document.querySelectorAll('.port-zoomable').forEach(el => {
                el.style.transform = _portZoom === 1 ? '' : 'scale(' + _portZoom + ')';
            });
            document.querySelectorAll('.port-zoom-controls button[title="Reset zoom"]').forEach(b => {
                b.textContent = Math.round(_portZoom * 100) + '%';
            });
        }
        function portZoom(delta) {
            setPortZoomAbs(delta === 0 ? 1 : _portZoom + delta);
        }
        // Pinch-to-zoom on the port maps (two fingers)
        let _pinchStart = null;
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2 && e.target.closest('.port-zoomable')) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                _pinchStart = { d: Math.hypot(dx, dy), z: _portZoom };
            }
        }, { passive: true });
        document.addEventListener('touchmove', (e) => {
            if (_pinchStart && e.touches.length === 2) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                setPortZoomAbs(_pinchStart.z * (Math.hypot(dx, dy) / _pinchStart.d));
            }
        }, { passive: false });

        function exportViewModal() {
            const config = currentViewModalConfig;
            if (!config || typeof XLSX === 'undefined') { alert('Nothing to export.'); return; }
            try {
                const wb = XLSX.utils.book_new();
                const used = new Set();
                (config.sections || []).forEach((section, i) => {
                    let rows = [];
                    if (section.type === 'details' && Array.isArray(section.data)) {
                        // label/value pair sections export as a single-row {label: value} sheet
                        const o = {};
                        section.data.forEach(d => {
                            let v = d.value;
                            if (v === null || v === undefined) v = '';
                            if (typeof v === 'object') v = JSON.stringify(v);
                            o[d.label || '(field)'] = v;
                        });
                        rows = [o];
                    } else {
                        rows = (section.data || []).map(row => {
                            const o = {};
                            (section.columns || []).forEach((col, ci) => {
                                const header = (section.headers && section.headers[ci]) || col;
                                let v = row[col];
                                if (v === null || v === undefined) v = '';
                                o[header] = typeof v === 'object' ? JSON.stringify(v) : v;
                            });
                            return o;
                        });
                    }
                    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ note: 'none' }]);
                    if (rows.length) ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.max(String(k).length + 2, 14) }));
                    let name = String(section.title || ('Sheet' + (i + 1))).replace(/[\\\/\?\*\[\]:]/g, ' ').slice(0, 31).trim() || ('Sheet' + (i + 1));
                    while (used.has(name)) name = name.slice(0, 28) + '_' + i;
                    used.add(name);
                    XLSX.utils.book_append_sheet(wb, ws, name);
                });

            if (!document.getElementById('nniModal')) {

                initializeModals();
            }
            
            editingNniId = nni.id;

            const form = document.getElementById('nniForm');
            
            // Populate dropdowns
            const [sites, equipment, fdps] = await Promise.all([
                store.getSites(),
                store.getEquipment(),
                store.getFdps()
            ]);
            
            const siteSelect = document.getElementById('nniSiteSelect');
            siteSelect.innerHTML = '<option value="">Select Site...</option>' + sites.map(site => `<option value="${site.id}">${(site.name || site.location || '(unnamed)') + (site.address ? ' — ' + site.address.split(',')[0] : '') + (site.name && site.cidCode ? ' [' + site.cidCode + ']' : '')}</option>`).join('');
            
            const equipmentSelect = document.getElementById('nniEquipmentSelect');
            equipmentSelect.innerHTML = '<option value="">Select Equipment...</option>' + equipment.map(eq => `<option value="${eq.id}">${eq.name} (${eq.type || 'N/A'})</option>`).join('');
            
            const fdpSelect = document.getElementById('nniFdpSelect');
            fdpSelect.innerHTML = '<option value="">Select FDP...</option>' + fdps.map(fdp => `<option value="${fdp.id}">${fdp.name}</option>`).join('');
            
            // Populate form values
            form.elements.name.value = nni.name || '';
            if (nni.direction) form.querySelector(`input[name="direction"][value="${nni.direction}"]`).checked = true;
            form.elements.siteId.value = nni.siteId || '';
            form.elements.connectionType.value = nni.connectionType || '';
            form.elements.equipmentID.value = nni.equipmentID || '';
            form.elements.fdpId.value = nni.fdpId || '';
            form.elements.contact.value = nni.contact || '';
            form.elements.description.value = nni.description || '';
            if (form.elements.soNumber) form.elements.soNumber.value = nni.soNumber || '';
            form.elements.notes.value = nni.notes || '';
            
            // Update port dropdowns if equipment/FDP selected
            if (nni.equipmentID) {
                await updateNniEquipmentPorts();
                // Pre-select ports
                const portsSelect = document.getElementById('nniEquipmentPortsSelect');
                const selectedPorts = (nni.equipmentPorts || '').split(',').map(p => p.trim());
                Array.from(portsSelect.options).forEach(option => {
                    if (selectedPorts.includes(option.value)) {
                        option.selected = true;
                    }
                });
            }
            
            if (nni.fdpId) {
                await updateNniFdpPorts();
                // Pre-select ports
                const portsSelect = document.getElementById('nniFdpPortsSelect');
                const selectedPorts = (nni.fdpPorts || '').split(',').map(p => p.trim());
                Array.from(portsSelect.options).forEach(option => {
                    if (selectedPorts.includes(option.value)) {
                        option.selected = true;
                    }
                });
            }
            
            document.getElementById('nniModal').classList.add('active');
        }

        async function saveNni(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            
            // Get selected ports from multi-select (returns array)
            const equipmentPortsSelect = document.getElementById('nniEquipmentPortsSelect');
            const fdpPortsSelect = document.getElementById('nniFdpPortsSelect');
            const equipmentPorts = Array.from(equipmentPortsSelect.selectedOptions).map(o => o.value).join(', ');
            const fdpPorts = Array.from(fdpPortsSelect.selectedOptions).map(o => o.value).join(', ');
            
            const nni = {
                syncSource: 'netinventory',  // engineer edits in app — v2 flow uses this to decide push direction
                name: formData.get('name'),
                direction: formData.get('direction'),
                siteId: formData.get('siteId'),
                
                equipmentID: formData.get('equipmentID') || '',
                equipmentPorts: equipmentPorts || '',
                fdpId: formData.get('fdpId') || '',
                fdpPorts: fdpPorts || '',
                contact: formData.get('contact') || '',
                description: formData.get('description') || '',
                soNumber: formData.get('soNumber') || '', notes: formData.get('notes') || ''
            };
            
            if (!(await confirmIfDuplicate('getNnis', 'name', nni.name, editingNniId, 'NNI named'))) return;
            try {
                if (editingNniId) {
                    await store.updateNni(editingNniId, nni);
                    alert('NNI updated successfully!');
                } else {
                    await store.addNni(nni);
                    alert('NNI added successfully!');
                }
                closeNniModal();
                await renderNnisPage();
            } catch (error) {
                console.error('Save error:', error);
                alert('Error saving NNI: ' + friendlyError(error));
            }
        }

        // Normalize NNI subinterface display (44.100, 100, .100 all show as "100")
        function normalizeSubinterface(subinterface) {
            if (!subinterface) return '-';
            
            const str = String(subinterface).trim();
            
            // Handle formats: "44.100", "100", ".100", etc.
            // Extract the last number after the last dot, or the whole number if no dot
            const match = str.match(/\.(\d+)$/);
            if (match) {
                // Has a dot - return number after last dot
                return match[1];
            }
            
            // No dot - return the number itself
            const numMatch = str.match(/^(\d+)$/);
            if (numMatch) {
                return numMatch[1];
            }
            
            // If format doesn't match expected patterns, return as-is
            return str;
        }

        // RU Intelligence: Smart position dropdown that only shows available positions
        async function updateAvailableRackPositions(equipmentId = null) {
            const rackSelect = document.getElementById('equipmentRackSelect');
            const positionSelect = document.getElementById('equipmentRuPosition');
            const sizeInput = document.getElementById('equipmentRuSize');
            
            if (!rackSelect || !positionSelect || !sizeInput) return;
            
            const selectedRackId = rackSelect.value;
            
            if (!selectedRackId) {
                positionSelect.innerHTML = '<option value="">Select rack first...</option>';
                return;
            }
            
            // Get rack details
            const rack = (await store.getRacks()).find(r => r.id === selectedRackId);
            if (!rack) return;
            
            const itemUnits = parseInt(sizeInput.value) || 1;
            
            // Get all equipment and FDPs in this rack (excluding current item if editing)
            const equipment = (await store.getEquipment()).filter(e => 
                e.rackId === selectedRackId && e.id !== equipmentId
            );
            const fdps = (await store.getFdps()).filter(f => 
                f.rackId === selectedRackId
            );
            
            // Build occupancy map
            const occupiedUnits = new Set();
            
            [...equipment, ...fdps].forEach(item => {
                const pos = parseInt(item.rackPosition || item.ruPosition);
                const units = parseInt(item.rackUnits || item.ruSize) || 1;
                if (pos && !isNaN(pos)) {
                    for (let i = 0; i < units; i++) {
                        occupiedUnits.add(pos + i);
                    }
                }
            });
            
            // Find available starting positions
            const availablePositions = [];
            const rackCapacity = parseInt(rack.ruCapacity) || 42;
            const maxPosition = rackCapacity - itemUnits + 1; // Can't start too high
            
            for (let pos = 1; pos <= maxPosition; pos++) {
                // Check if this position and all required units above it are free
                let canFit = true;
                for (let i = 0; i < itemUnits; i++) {
                    if (occupiedUnits.has(pos + i)) {
                        canFit = false;
                        break;
                    }
                }
                if (canFit) {
                    availablePositions.push(pos);
                }
            }
            
            // Save current selection
            const currentSelection = positionSelect.value;
            
            // Populate dropdown
            if (availablePositions.length === 0) {
                positionSelect.innerHTML = '<option value="">No available positions for this size</option>';
            } else {
                positionSelect.innerHTML = '<option value="">Select position...</option>';
                availablePositions.forEach(pos => {
                    const option = document.createElement('option');
                    option.value = pos;
                    option.textContent = `U${pos}${itemUnits > 1 ? ` (spans U${pos}-U${pos + itemUnits - 1})` : ''}`;
                    if (pos.toString() === currentSelection) {
                        option.selected = true;
                    }
                    positionSelect.appendChild(option);
                });
            }
        }
        
        // Visual Rack Layout Modal
        async function viewRackLayout(rackId) {
            const rack = (await store.getRacks()).find(r => r.id === rackId);
            if (!rack) {
                alert('Rack not found');
                return;
            }
            
            const [equipment, fdps, site, allEquipment] = await Promise.all([
                store.getEquipment().then(e => e.filter(eq => eq.rackId === rackId)),
                store.getFdps().then(f => f.filter(fdp => fdp.rackId === rackId)),
                rack.siteId ? store.getSites().then(s => s.find(site => site.id === rack.siteId)) : Promise.resolve(null),
                store.getEquipment() // Get all equipment to find line cards
            ]);
            
            // Build occupancy map
            const occupiedUnits = new Map();
            let totalUsedUnits = 0;
            
            [...equipment, ...fdps].forEach(item => {
                const pos = parseInt(item.rackPosition || item.ruPosition);
                const units = parseInt(item.rackUnits || item.ruSize) || 1;
                const isFdp = fdps.includes(item);
                
                if (pos && !isNaN(pos)) {
                    totalUsedUnits += units;
                    for (let i = 0; i < units; i++) {
                        occupiedUnits.set(pos + i, {
                            item: item,
                            type: isFdp ? 'fdp' : 'equipment',
                            isStart: i === 0,
                            totalUnits: units
                        });
                    }
                }
            });
            
            const rackCapacity = parseInt(rack.ruCapacity) || 42;
            const utilization = Math.round((totalUsedUnits / rackCapacity) * 100);
            
            // Generate rack units HTML (top to bottom: U1 to U42)
            let rackUnitsHTML = '';
            for (let i = 1; i <= rackCapacity; i++) {
                const unitInfo = occupiedUnits.get(i);
                
                // Skip continuation units (already rendered with the start unit)
                if (unitInfo && !unitInfo.isStart) {
                    continue;
                }
                
                const isOccupied = !!unitInfo;
                const rowspan = unitInfo ? unitInfo.totalUnits : 1;
                const item = unitInfo?.item;
                const itemType = unitInfo?.type;
                const isFdp = itemType === 'fdp';

                const height = 30 * rowspan;

                    <div class="rack-unit ${isOccupied ? (isFdp ? 'fdp-occupied' : 'occupied') : ''}" 
                         style="min-height: ${height}px;"
                         ${isOccupied && item && clickHandler ? `onclick="${clickHandler}" title="Click to view ${isFdp ? 'FDP' : 'equipment'} details"` : ''}>
                        <div class="rack-unit-label">
                            <span>U${i}</span>

                                        // Check if this equipment has line cards

                                        return '';
                                    })()}
                                `}
                            ` : ''}
                        </div>

        // Line-side info for DWDM gear: which ports are line ports, and how many
        // 100G client ports are active given the provisioned line capacity.
        function getEquipmentLineInfo(equip) {
            if (!equip || !equip.linePorts) return null;
            const lineSet = new Set(String(equip.linePorts).split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n)));
            if (lineSet.size === 0) return null;
            let activeClients = null;
            if (equip.lineCapacity) {
                let total = 0;
                const matches = String(equip.lineCapacity).match(/(\d+(?:\.\d+)?)\s*G/gi);
                if (matches) matches.forEach(m => total += parseFloat(m));
                if (total > 0) activeClients = Math.floor(total / 100);
            }
            return { lineSet, activeClients };
        }

        async function updateNniEquipmentPorts() {
            const equipmentId = document.getElementById('nniEquipmentSelect').value;
            const portsGroup = document.getElementById('nniEquipmentPortsGroup');
            const portsSelect = document.getElementById('nniEquipmentPortsSelect');
            
            if (!equipmentId) {
                portsGroup.style.display = 'none';
                return;
            }
            
            const equipment = (await store.getEquipment()).find(e => e.id === equipmentId);
            const allNnis = await store.getNnis();
            const currentNniId = editingNniId;
            
            // Get used ports from other NNIs
            const usedPorts = allNnis
                .filter(n => n.equipmentID === equipmentId && n.id !== currentNniId)
                .flatMap(n => (n.equipmentPorts || '').split(',').map(p => p.trim()))
                .filter(Boolean);
            
            // Parse equipment portConfig to generate port list
            let ports = [];
            if (equipment && equipment.portConfig) {
                const config = equipment.portConfig;
                
                // Check if already has explicit port names like "Gi0/0/1-48"
                if (config.includes('Gi') || config.includes('Te') || config.includes('Fa') || config.includes('Et')) {
                    // Already has port names - extract them
                    const matches = config.match(/[A-Z][a-z]+\d+\/\d+\/\d+(-\d+)?/g);
                    if (matches) {
                        matches.forEach(match => {
                            if (match.includes('-')) {
                                const [base, range] = match.split('-');
                                const [prefix, ...parts] = base.split('/');
                                const start = parseInt(parts[parts.length - 1]);
                                const end = parseInt(range);
                                for (let i = start; i <= end; i++) {
                                    const newParts = [...parts];
                                    newParts[newParts.length - 1] = i;
                                    ports.push(`${prefix}/${newParts.join('/')}`);
                                }
                            } else {
                                ports.push(match);
                            }
                        });
                    }
                } else {
                    // Parse count-based format like "40x1G/10G/25G, 6x100G"
                    // Find all patterns of "NUMBERx" with optional speed info after
                    const portGroups = config.match(/(\d+)x\s*([^,]+)/gi) || [];
                    
                    let portNum = 1;
                    portGroups.forEach(group => {
                        const countMatch = group.match(/(\d+)x/i);
                        const speedMatch = group.match(/x\s*([^,]+)/i);
                        
                        if (countMatch) {
                            const count = parseInt(countMatch[1]);
                            const speed = speedMatch ? speedMatch[1].trim() : '';
                            
                            // Generate port names with speed indicator
                            for (let i = 0; i < count; i++) {
                                ports.push(`Port ${portNum} (${speed})`);
                                portNum++;
                            }
                        }
                    });
                }
            }
            
            // Line-side gating: line ports are facility endpoints (not NNI clients),
            // and only the first N client ports are active per provisioned line capacity.
            const lineInfo = getEquipmentLineInfo(equipment);
            if (lineInfo && ports.length > 0) {
                ports = ports.filter((p, i) => !lineInfo.lineSet.has(i + 1));
                if (lineInfo.activeClients !== null) {
                    ports = ports.map((p, i) => i < lineInfo.activeClients ? p : p + ' [inactive - line capacity]');
                }
            }
            
            // If no ports parsed, generate generic list
            if (ports.length === 0) {
                for (let i = 1; i <= 48; i++) {
                    ports.push(`Port ${i}`);
                }
            }
            
            // Filter out used ports
            const availablePorts = ports.filter(p => !usedPorts.includes(p));
            
            // Populate dropdown
            portsSelect.innerHTML = availablePorts.length > 0 
                ? availablePorts.map(p => `<option value="${p}">${p}</option>`).join('')
                : '<option value="">No available ports</option>';
            
            portsGroup.style.display = 'block';
        }
        
        async function updateNniFdpPorts() {
            const fdpId = document.getElementById('nniFdpSelect').value;

        // Smart port configuration parser
        function parsePortConfig(portConfig) {
            if (!portConfig || typeof portConfig !== 'string') {
                return { total: 0, parsed: false };
            }
            
            // Parse formats like: "40x1G/10G/25G, 6X100G" or "48 x 1G" or "24x10G, 2x40G"
            // Extract all "NUMBERxSPEED" patterns
            const regex = /(\d+)\s*[xX×]\s*[\d.]+[GMK]?/gi;
            const matches = portConfig.match(regex);
            
            if (!matches || matches.length === 0) {
                // Try simple number at start: "48" or "48 ports"
                const simpleMatch = portConfig.match(/^(\d+)/);
                if (simpleMatch) {
                    return { total: parseInt(simpleMatch[1]), parsed: true };
                }
                return { total: 0, parsed: false };
            }
            
            // Sum all port counts
            let total = 0;
            matches.forEach(match => {
                const numMatch = match.match(/(\d+)/);
                if (numMatch) {
                    total += parseInt(numMatch[1]);
                }
            });
            
            return { total, parsed: true };
        }

        // Dark Fiber CRUD Functions
        let editingDarkFiberRouteId = null;

        let currentViewingRouteId = null;
        
        // ============ OTDR PINPOINT & SEGMENT COLORS ============
        // Alternating palette so adjacent segments are always visually distinct
        // (red is reserved for the OTDR fault marker)
        const SEGMENT_COLORS = ['#3b82f6', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6', '#06b6d4'];

        function runOtdrPinpoint() {
            const data = window._otdrRouteData;
            const resultEl = document.getElementById('otdrResult');
            const marker = document.getElementById('otdrMarker');
            const markerLabel = document.getElementById('otdrMarkerLabel');
            if (!data || !resultEl || !marker) return;

            const showError = (msg) => {
                resultEl.style.display = 'block';
                resultEl.style.background = 'rgba(239, 68, 68, 0.1)';
                resultEl.style.border = '1px solid #ef4444';
                resultEl.innerHTML = msg;
                marker.style.display = 'none';
            };

            const raw = parseFloat(document.getElementById('otdrDistanceInput').value);
            const unit = document.getElementById('otdrUnitSelect').value;
            if (isNaN(raw) || raw < 0) {
                showError('⚠️ Enter a valid distance value.');
                return;
            }

            // Convert input to km
            let measured = raw;
            if (unit === 'ft') measured = raw / 3280.84;
            if (unit === 'mi') measured = raw * 1.609344;

            // Reference point (route end or segment boundary) and shot direction
            const refSelect = document.getElementById('otdrRefSelect');
            const dirSelect = document.getElementById('otdrDirSelect');
            const refKm = refSelect ? parseFloat(refSelect.value) || 0 : 0;
            const refLabel = refSelect ? refSelect.options[refSelect.selectedIndex].text.replace(/ — .*$/, '') : 'A-End';
            const dir = dirSelect ? dirSelect.value : 'z';
            const dirLabel = dir === 'z' ? `toward ${data.zLocation}` : `toward ${data.aLocation}`;
            const km = refKm + (dir === 'z' ? measured : -measured);

            const totalKm = data.totalKm;
            const ftStr = Math.round(measured * 3280.84).toLocaleString();
            const miStr = (measured / 1.609344).toFixed(2);
            const shotDesc = `<strong>${measured.toFixed(2)} km</strong> (${ftStr} ft / ${miStr} mi) measured from <strong>${refLabel}</strong> ${dirLabel}`;

            if (!totalKm || totalKm <= 0) {
                showError('⚠️ This route has no segment distances entered, so the fault location cannot be mapped.');
                return;
            }

            if (km < 0) {
                marker.style.left = '0%';
                marker.style.display = 'block';
                markerLabel.textContent = '< 0 km';
                showError(`⚠️ ${shotDesc} lands <strong>${Math.abs(km).toFixed(2)} km past ${data.aLocation}</strong> — off the A-end of this route. ` +
                    `Check the shot direction, or the OTDR reading includes slack/launch fiber. Marker pinned at route start.`);
                marker.style.display = 'block';
                return;
            }

            if (km > totalKm) {
                marker.style.left = '100%';
                marker.style.display = 'block';
                markerLabel.textContent = km.toFixed(2) + ' km';
                showError(`⚠️ ${shotDesc} lands <strong>${(km - totalKm).toFixed(2)} km past ${data.zLocation}</strong> — beyond the route's ${totalKm.toFixed(2)} km total. ` +
                    `Check the shot direction, or the OTDR reading includes slack/launch fiber not in the as-built distances. Marker pinned at route end.`);
                marker.style.display = 'block';
                return;
            }

            // Walk segments to find where the fault lands
            let cum = 0, found = null, segStart = 0, colorIdx = 0;
            for (let i = 0; i < data.segments.length; i++) {
                const s = data.segments[i];
                if (km <= cum + s.km || i === data.segments.length - 1) {
                    found = s; segStart = cum; colorIdx = i;
                    break;
                }
                cum += s.km;
            }

            const intoSeg = km - segStart;
            const segEnd = segStart + found.km;
            const remaining = totalKm - km;
            const pct = Math.min((km / totalKm) * 100, 100);

            marker.style.left = pct.toFixed(3) + '%';
            marker.style.display = 'block';
            markerLabel.textContent = km.toFixed(2) + ' km';

            const segColor = SEGMENT_COLORS[colorIdx % SEGMENT_COLORS.length];
            resultEl.style.display = 'block';
            resultEl.style.background = 'rgba(16, 185, 129, 0.08)';
            resultEl.style.border = '1px solid ' + segColor;
            resultEl.innerHTML =
                `📍 ${shotDesc} lands at <strong>${km.toFixed(2)} km</strong> from ${data.aLocation}, in ` +
                `<span style="color: ${segColor}; font-weight: 700;">Segment ${found.order}: ${found.provider}</span>` +
                ` (${found.ownership || 'Unknown'}${found.name ? ' — ' + found.name : ''})<br>` +
                `↳ <strong>${intoSeg.toFixed(2)} km</strong> into this segment from its A-side (segment spans ${segStart.toFixed(2)}–${segEnd.toFixed(2)} km) · ` +
                `${(segEnd - km).toFixed(2)} km to the segment's Z-side · ${remaining.toFixed(2)} km to ${data.zLocation}` +
                `<br><span style="font-size: 0.8rem; color: var(--text-tertiary);">Note: OTDR measures optical fiber length (includes slack loops & launch fiber), so the physical fault may be slightly before this point.</span>`;
        }

        // ============ STORAGE DRIVE RESOLVER ============
        // Resolves the Graph API base path for a configured storage location
        // (handles other sites and non-default libraries), cached per session.
        const _driveCache = {};
        async function getStorageBase(kind) {
            const cfg = SHAREPOINT_CONFIG.storage[kind];
            const key = (cfg.siteUrl || 'default') + '|' + (cfg.libraryName || 'default');
            if (_driveCache[key]) return _driveCache[key];
            let siteId = SHAREPOINT_CONFIG.siteId;
            if (cfg.siteUrl) {
                const u = new URL(cfg.siteUrl);
                const site = await graphClient.callAPI(`/sites/${u.hostname}:${u.pathname.replace(/\/$/, '')}`);
                siteId = site.id;
            }
            let base = `/sites/${siteId}/drive`;
            if (cfg.libraryName) {
                const drives = await graphClient.callAPI(`/sites/${siteId}/drives`);
                const d = (drives.value || []).find(x => (x.name || '').toLowerCase() === cfg.libraryName.toLowerCase());
                if (!d) throw new Error(`Document library "${cfg.libraryName}" was not found on the storage site. Check SHAREPOINT_CONFIG.storage.`);
                base = `/sites/${siteId}/drives/${d.id}`;
            }
            _driveCache[key] = base;
            return base;
        }

        // Compose a full Graph endpoint inside a storage location: base + optional folder + rest
        async function storageEndpoint(kind, rest) {
            const base = await getStorageBase(kind);
            const cfg = SHAREPOINT_CONFIG.storage[kind];
            const prefix = cfg.folder ? cfg.folder + '/' : '';
            return `${base}/root:/${prefix}${rest}`;
        }

        function capturePhotos(useCamera) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            if (useCamera) input.capture = 'environment';
            else input.multiple = true;
            input.onchange = async () => {
                const files = Array.from(input.files || []);
                if (!files.length) return;
                const status = document.getElementById('photoStatus');
                let done = 0, failed = 0;
                for (const file of files) {
                    if (file.size > 4 * 1024 * 1024) {
                        // Downscale large phone photos client-side to stay under the 4MB single-PUT limit
                        try {
                            const small = await downscaleImage(file, 2200, 0.85);
                            await uploadSitePhoto(small, file.name);
                            done++;
                        } catch (e) { console.error(e); failed++; }
                    } else {
                        try { await uploadSitePhoto(file, file.name); done++; }
                        catch (e) { console.error(e); failed++; }
                    }
                    if (status) status.textContent = `Uploading… ${done + failed}/${files.length}`;
                }
                if (failed > 0) alert(`${failed} photo(s) failed to upload. ${done} succeeded.`);
                await refreshPhotoGallery();
            };
            input.click();
        }

        async function uploadSitePhoto(blob, originalName) {
            const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
            const safeName = (originalName || 'photo.jpg').replace(/[^a-zA-Z0-9._-]/g, '_');
            const path = await storageEndpoint('sitePhotos', `${_photosSiteId}/${stamp}-${safeName}:/content`);
            await graphClient.uploadFile(path, blob);
        }

        function downscaleImage(file, maxDim, quality) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(b => b ? resolve(b) : reject(new Error('Image processing failed')), 'image/jpeg', quality);
                    URL.revokeObjectURL(img.src);
                };
                img.onerror = () => reject(new Error('Could not read image'));
                img.src = URL.createObjectURL(file);
            });
        }

        async function saveDarkFiberSegment(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            
            const segment = {
                routeId: currentViewingRouteId,
                segmentOrder: parseInt(formData.get('segmentOrder')),
                segmentName: formData.get('segmentName'),
                ownershipType: formData.get('ownershipType'),
                usageType: formData.get('usageType'),
                providerName: formData.get('providerName'),
                customerName: formData.get('customerName'),
                distance: parseFloat(formData.get('distance')),
                strandNumbers: formData.get('strandNumbers'),
                fiberType: formData.get('fiberType'),
                fiberCount: formData.get('fiberCount') ? parseInt(formData.get('fiberCount')) : null,
                aEndLocation: formData.get('aEndLocation'),
                aEndConnectionType: formData.get('aEndConnectionType'),
                aEndFDP: formData.get('aEndFDP'),
                aEndPort: formData.get('aEndPort'),
                aEndEquipment: formData.get('aEndEquipment'),
                zEndLocation: formData.get('zEndLocation'),
                zEndConnectionType: formData.get('zEndConnectionType'),
                zEndFDP: formData.get('zEndFDP'),
                zEndPort: formData.get('zEndPort'),
                zEndEquipment: formData.get('zEndEquipment'),
                providerCircuitID: formData.get('providerCircuitID'),
                soNumber: formData.get('soNumber') || '', notes: formData.get('notes')
            };
            
            // Auto-set provider name for owned fiber
            if (segment.ownershipType === 'Owned' && !segment.providerName) {
                segment.providerName = 'IRIS Networks';
            }
            
            // Numeric validation (SharePoint Number columns reject NaN)
            if (isNaN(segment.distance)) { alert('Distance must be a number (km), e.g. 12.5'); return; }
            if (isNaN(segment.segmentOrder)) { alert('Segment order must be a number, e.g. 1'); return; }
            try {
                if (editingDarkFiberSegmentId) {
                    await store.updateDarkFiberSegment(editingDarkFiberSegmentId, segment);
                    alert('Segment updated successfully!');
                } else {
                    await store.addDarkFiberSegment(segment);
                    alert('Segment added successfully!');
                }
                closeDarkFiberSegmentModal();
                await viewDarkFiberRoute(currentViewingRouteId);
            } catch (error) {
                console.error('Save error:', error);
                alert('Error saving segment: ' + friendlyError(error));
            }
        }
        
        async function deleteDarkFiberSegment(segmentId) {
            if (!confirm('Delete this segment? This cannot be undone.')) return;
            
            try {
                const segments = await store.getDarkFiberSegments();
                const segment = segments.find(s => s.id === segmentId);
                await store.deleteDarkFiberSegment(segmentId);
                alert('Segment deleted successfully!');
                await viewDarkFiberRoute(segment.routeId);
            } catch (error) {
                console.error('Delete error:', error);
                alert('Error deleting segment: ' + friendlyError(error));

        }

        async function renderAvailablePortsPage() {
            const content = document.getElementById('content');
            
            try {
                // Load all data
                const [sites, equipment, fdps, circuits, nnis, racks] = await Promise.all([
                    store.getSites(),
                    store.getEquipment(),
                    store.getFdps(),
                    store.getCircuits(),
                    store.getNnis(),
                    store.getRacks()
                ]);
                
                // Calculate port utilization for all equipment
                const equipmentStats = equipment.map(equip => {
                    const site = sites.find(s => s.id === equip.siteId);
                    
                    // Parse port configuration to get total ports
                    const portInfo = parsePortConfig(equip.portConfig);
                    const totalPorts = portInfo.total;
                    const hasPortConfig = portInfo.parsed;
                    
                    // Find circuits using this equipment
                    const equipCircuits = circuits.filter(c => 
                        c.aEquipment === equip.id || c.zEquipment === equip.id
                    );
                    
                    // Find NNIs using this equipment
                    const equipNnis = nnis.filter(n => n.equipmentID === equip.id);
                    
                    // Count used ports (rough estimate - each circuit/NNI uses 1+ ports)
                    const usedPorts = equipCircuits.length + equipNnis.length;
                    const availablePorts = Math.max(0, totalPorts - usedPorts);
                    const utilization = totalPorts > 0 ? ((usedPorts / totalPorts) * 100).toFixed(1) : 0;
                    
                    return {
                        id: equip.id,
                        name: equip.name,
                        type: 'Equipment',
                        siteName: site ? site.name : 'Unknown',
                        siteId: site ? site.id : null,
                        totalPorts,
                        usedPorts,
                        availablePorts,
                        utilization: parseFloat(utilization),
                        circuits: equipCircuits.length,
                        nnis: equipNnis.length,
                        hasPortConfig,
                        portConfigText: equip.portConfig || 'Not configured'
                    };
                }); // Show ALL equipment, even without ports configured
                
                // Calculate port utilization for all FDPs
                const fdpStats = fdps.map(fdp => {
                    const site = sites.find(s => s.id === fdp.siteId);
                    const totalPorts = fdp.portCount || 0;
                    
                    // Find circuits using this FDP
                    const fdpCircuits = circuits.filter(c => 
                        c.aFdp === fdp.id || c.zFdp === fdp.id ||
                        c.aEquipmentFdp === fdp.id || c.zEquipmentFdp === fdp.id
                    );
                    
                    // Find NNIs using this FDP
                    const fdpNnis = nnis.filter(n => n.fdpId === fdp.id);
                    
                    const usedPorts = fdpCircuits.length + fdpNnis.length;
                    const availablePorts = Math.max(0, totalPorts - usedPorts);
                    const utilization = totalPorts > 0 ? ((usedPorts / totalPorts) * 100).toFixed(1) : 0;
                    
                    return {
                        id: fdp.id,
                        name: fdp.name,
                        type: 'FDP',
                        siteName: site ? site.name : 'Unknown',
                        siteId: site ? site.id : null,
                        totalPorts,
                        usedPorts,
                        availablePorts,
                        utilization: parseFloat(utilization),
                        circuits: fdpCircuits.length,
                        nnis: fdpNnis.length
                    };
                }).filter(f => f.totalPorts > 0); // Only show FDPs with ports
                
                // Enhance equipment stats with vendor info
                const enhancedEquipmentStats = equipmentStats.map(stat => {
                    const equip = equipment.find(e => e.id === stat.id);
                    return {
                        ...stat,
                        vendor: equip.manufacturer || 'Unknown Vendor'
                    };
                });
                
                // Group equipment by vendor
                const equipmentByVendor = {};
                enhancedEquipmentStats.forEach(stat => {
                    if (!equipmentByVendor[stat.vendor]) {
                        equipmentByVendor[stat.vendor] = [];
                    }
                    equipmentByVendor[stat.vendor].push(stat);
                });
                
                // Sort equipment within each vendor by available ports
                Object.keys(equipmentByVendor).forEach(vendor => {
                    equipmentByVendor[vendor].sort((a, b) => b.availablePorts - a.availablePorts);
                });
                
                // Sort FDPs by available ports
                fdpStats.sort((a, b) => b.availablePorts - a.availablePorts);
                
                // Combine for overall statistics
                const allPortStats = [...enhancedEquipmentStats, ...fdpStats];
                
                // Calculate overall statistics
                const totalPortsNetwork = allPortStats.reduce((sum, item) => sum + item.totalPorts, 0);
                const totalUsedNetwork = allPortStats.reduce((sum, item) => sum + item.usedPorts, 0);
                const totalAvailableNetwork = allPortStats.reduce((sum, item) => sum + item.availablePorts, 0);
                const avgUtilization = totalPortsNetwork > 0 ? ((totalUsedNetwork / totalPortsNetwork) * 100).toFixed(1) : 0;
                
                // Equipment statistics
                const totalEquipmentPorts = enhancedEquipmentStats.reduce((sum, item) => sum + item.totalPorts, 0);
                const totalEquipmentUsed = enhancedEquipmentStats.reduce((sum, item) => sum + item.usedPorts, 0);
                const totalEquipmentAvailable = enhancedEquipmentStats.reduce((sum, item) => sum + item.availablePorts, 0);
                const equipmentUtilization = totalEquipmentPorts > 0 ? ((totalEquipmentUsed / totalEquipmentPorts) * 100).toFixed(1) : 0;
                
                // FDP statistics
                const totalFdpPorts = fdpStats.reduce((sum, item) => sum + item.totalPorts, 0);
                const totalFdpUsed = fdpStats.reduce((sum, item) => sum + item.usedPorts, 0);
                const totalFdpAvailable = fdpStats.reduce((sum, item) => sum + item.availablePorts, 0);
                const fdpUtilization = totalFdpPorts > 0 ? ((totalFdpUsed / totalFdpPorts) * 100).toFixed(1) : 0;
                
                // Group by site for filter
                const siteGroups = {};
                allPortStats.forEach(item => {
                    if (!siteGroups[item.siteName]) {
                        siteGroups[item.siteName] = [];
                    }
                    siteGroups[item.siteName].push(item);
                });
                
                // ===== Per-site capacity rollup (RU, power, ports) =====
                const parseAmps = (v) => { const n = parseFloat(String(v || '').replace(/[^0-9.]/g, '')); return isNaN(n) ? 0 : n; };
                const siteCapacity = sites.map(site => {
                    const siteRacks = racks.filter(r => r.siteId === site.id);
                    const rackIds = new Set(siteRacks.map(r => r.id));
                    const rackedItems = [...equipment, ...fdps].filter(i => i.rackId && rackIds.has(i.rackId));
                    const totalRU = siteRacks.reduce((s, r) => s + (parseInt(r.rackUnits) || 0), 0);
                    const usedRU = rackedItems.reduce((s, i) => s + (parseInt(i.rackUnits) || 1), 0);
                    
                    const purchasedAC = siteRacks.reduce((s, r) => s + parseAmps(r.purchasedPowerAC), 0);
                    const purchasedDC = siteRacks.reduce((s, r) => s + parseAmps(r.purchasedPowerDC), 0);
                    const siteEquip = equipment.filter(e => e.siteId === site.id || (e.rackId && rackIds.has(e.rackId)));
                    const usedAC = siteEquip.filter(e => /ac/i.test(e.powerType || '')).reduce((s, e) => s + parseAmps(e.powerDraw), 0);
                    const usedDC = siteEquip.filter(e => /dc/i.test(e.powerType || '')).reduce((s, e) => s + parseAmps(e.powerDraw), 0);
                    
                    const sFdp = fdpStats.filter(f => f.siteId === site.id);
                    const fdpTotal = sFdp.reduce((s, f) => s + f.totalPorts, 0);
                    const fdpUsed = sFdp.reduce((s, f) => s + f.usedPorts, 0);
                    const sEq = enhancedEquipmentStats.filter(e => e.siteId === site.id && e.hasPortConfig);
                    const eqTotal = sEq.reduce((s, e) => s + e.totalPorts, 0);
                    const eqUsed = sEq.reduce((s, e) => s + e.usedPorts, 0);
                    
                    return { site, rackCount: siteRacks.length, totalRU, usedRU, purchasedAC, usedAC, purchasedDC, usedDC, fdpTotal, fdpUsed, eqTotal, eqUsed };
                }).filter(c => c.rackCount > 0 || c.fdpTotal > 0 || c.eqTotal > 0)
                  .sort((a, b) => (b.totalRU ? b.usedRU / b.totalRU : 0) - (a.totalRU ? a.usedRU / a.totalRU : 0));
                
                const capBar = (used, total, unit) => {
                    if (!total) return `<div style="font-size: 0.8rem; color: var(--text-tertiary);">—</div>`;
                    const pct = Math.min((used / total) * 100, 100);
                    const color = pct >= 90 ? '#ef4444' : pct >= 70 ? '#f59e0b' : '#10b981';
                    return `
                        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 0.25rem;">
                            <span>${used}${unit} / ${total}${unit}</span>
