<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetInventory v3.0</title>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #0a0e14; }
    #root { width: 100%; min-height: 100vh; }
    input, select, textarea, button { font-family: inherit; }
    input[type="checkbox"], input[type="radio"] { accent-color: #00ff9f; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f1419; }
    ::-webkit-scrollbar-thumb { background: #2a3441; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">

const { useState, useEffect, useMemo } = React;

const storage = {
  async get(key) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; }
  },
  async set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
  }
};

// ============ SHARED COMPONENTS ============

function FormField({ label, value, onChange, type = 'text', required = false, multiline = false, placeholder = '', options = [] }) {
  const safeValue = value ?? '';
  const inputStyle = {
    width: '100%',
    padding: '0.625rem 0.875rem',
    background: '#0a0e14',
    border: '1px solid #2a3441',
    borderRadius: '8px',
    color: '#c5d1de',
    fontSize: '0.875rem',
    outline: 'none'
  };
  return (
    <div style={{ marginBottom: '1rem' }}>
      <label style={{ display: 'block', marginBottom: '0.4rem', fontSize: '0.8rem', color: '#6b8299', fontWeight: 500 }}>
        {label} {required ? <span style={{ color: '#ff6b9d' }}>*</span> : null}
      </label>
      {type === 'select' ? (
        <select value={safeValue} onChange={(e) => onChange(e.target.value)} required={required} style={inputStyle}>
          <option value="">Select...</option>
          {options.map(opt => (
            <option key={opt.value} value={opt.value}>{opt.label}</option>
          ))}
        </select>
      ) : multiline ? (
        <textarea value={safeValue} onChange={(e) => onChange(e.target.value)} required={required} placeholder={placeholder} rows={3} style={inputStyle} />
      ) : (
        <input type={type} value={safeValue} onChange={(e) => onChange(e.target.value)} required={required} placeholder={placeholder} style={inputStyle} />
      )}
    </div>
  );
}

function CheckboxField({ label, checked, onChange }) {
  return (
    <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', color: '#c5d1de', fontSize: '0.875rem', cursor: 'pointer' }}>
      <input type="checkbox" checked={!!checked} onChange={(e) => onChange(e.target.checked)} />
      {label}
    </label>
  );
}

function SectionHeader({ title, color }) {
  return (
    <div style={{ marginTop: '1.25rem', marginBottom: '1rem', paddingTop: '1rem', borderTop: '1px solid #2a3441' }}>
      <h4 style={{ fontSize: '0.85rem', fontWeight: 600, color: color || '#00ff9f', margin: 0 }}>{title}</h4>
    </div>
  );
}

function RadioCards({ label, value, onChange, optionA, optionB }) {
  const cardStyle = (active, color) => ({
    flex: 1,
    padding: '0.75rem',
    background: active ? color + '20' : '#1a1f2e',
    border: '2px solid ' + (active ? color : '#2a3441'),
    borderRadius: '8px',
    cursor: 'pointer',
    display: 'flex',
    alignItems: 'flex-start',
    gap: '0.5rem'
  });
  return (
    <div style={{ marginBottom: '1.25rem' }}>
      <label style={{ display: 'block', marginBottom: '0.5rem', fontSize: '0.8rem', color: '#6b8299', fontWeight: 600 }}>{label}</label>
      <div style={{ display: 'flex', gap: '1rem' }}>
        <div onClick={() => onChange(optionA.value)} style={cardStyle(value === optionA.value, '#00ff9f')}>
          <input type="radio" checked={value === optionA.value} onChange={() => onChange(optionA.value)} />
          <div>
            <div style={{ color: '#fff', fontWeight: 600, fontSize: '0.85rem' }}>{optionA.title}</div>
            <div style={{ color: '#6b8299', fontSize: '0.72rem' }}>{optionA.desc}</div>
          </div>
        </div>
        <div onClick={() => onChange(optionB.value)} style={cardStyle(value === optionB.value, '#00d4ff')}>
          <input type="radio" checked={value === optionB.value} onChange={() => onChange(optionB.value)} />
          <div>
            <div style={{ color: '#fff', fontWeight: 600, fontSize: '0.85rem' }}>{optionB.title}</div>
            <div style={{ color: '#6b8299', fontSize: '0.72rem' }}>{optionB.desc}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Modal({ title, children, onClose }) {
  return (
    <div style={{
      position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
      background: 'rgba(10, 14, 20, 0.9)', display: 'flex',
      alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '2rem'
    }}>
      <div style={{
        background: '#151a24', border: '1px solid #2a3441', borderRadius: '14px',
        padding: '1.75rem', maxWidth: '760px', width: '100%', maxHeight: '88vh', overflowY: 'auto'
      }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.25rem' }}>
          <h2 style={{ fontSize: '1.2rem', fontWeight: 700, color: '#fff', margin: 0 }}>{title}</h2>
          <button onClick={onClose} style={{ padding: '0.4rem 0.8rem', background: '#2a3441', border: 'none', borderRadius: '6px', color: '#c5d1de', cursor: 'pointer' }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function FormButtons({ onCancel, saveLabel }) {
  return (
    <div style={{ display: 'flex', gap: '1rem', justifyContent: 'flex-end', marginTop: '1.25rem', paddingTop: '1rem', borderTop: '1px solid #2a3441' }}>
      <button type="button" onClick={onCancel} style={{ padding: '0.6rem 1.4rem', background: '#2a3441', border: 'none', borderRadius: '8px', color: '#c5d1de', fontSize: '0.875rem', cursor: 'pointer' }}>
        Cancel
      </button>
      <button type="submit" style={{ padding: '0.6rem 1.4rem', background: '#00ff9f', border: 'none', borderRadius: '8px', color: '#0a0e14', fontSize: '0.875rem', fontWeight: 700, cursor: 'pointer' }}>
        {saveLabel || 'Save'}
      </button>
    </div>
  );
}

// ============ SITE MODAL ============

function SiteModal({ site, onSave, onClose }) {
  const [formData, setFormData] = useState(site || {
    id: '', name: '', clli: '', siteType: 'internal', siteCode: '',
    street: '', city: '', state: '', zip: '',
    accessHours: '', customerName: '', customerContact: '', customerPhone: '', notes: ''
  });

  const set = (field) => (value) => setFormData(prev => ({ ...prev, [field]: value }));

  const handleSubmit = (e) => {
    e.preventDefault();
    onSave({ ...formData, id: formData.id || 'site-' + Date.now() });
  };

  return (
    <Modal title={site ? 'Edit Site' : 'Add New Site'} onClose={onClose}>
      <form onSubmit={handleSubmit}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 1rem' }}>
          <FormField label="Site Name" value={formData.name} onChange={set('name')} required placeholder="e.g., Denver CO Hut 4" />
          <FormField label="CLLI Code" value={formData.clli} onChange={set('clli')} placeholder="e.g., DNVRCOMA" />
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 1rem' }}>
          <FormField label="Site Type" type="select" value={formData.siteType} onChange={set('siteType')}
            options={[
              { value: 'internal', label: 'Internal (Our Facility)' },
              { value: 'customer', label: 'Customer Location' },
              { value: 'carrier', label: 'Carrier Hotel / Colo' }
            ]} />
          <FormField label="Site Code" value={formData.siteCode} onChange={set('siteCode')} placeholder="Internal short code" />
        </div>
        <SectionHeader title="Address" color="#00d4ff" />
        <FormField label="Street Address" value={formData.street} onChange={set('street')} />
        <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 1fr', gap: '0 1rem' }}>
          <FormField label="City" value={formData.city} onChange={set('city')} />
          <FormField label="State" value={formData.state} onChange={set('state')} />
          <FormField label="ZIP" value={formData.zip} onChange={set('zip')} />
        </div>
        <FormField label="Access Hours / Instructions" value={formData.accessHours} onChange={set('accessHours')} placeholder="e.g., 24/7 badge access, escort required" />
        {formData.siteType === 'customer' ? (
          <div>
            <SectionHeader title="Customer Contact" color="#ffd700" />
            <FormField label="Customer Name" value={formData.customerName} onChange={set('customerName')} />
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 1rem' }}>
              <FormField label="Contact Person" value={formData.customerContact} onChange={set('customerContact')} />
              <FormField label="Phone" value={formData.customerPhone} onChange={set('customerPhone')} />
            </div>
          </div>
        ) : null}
        <FormField label="Notes" value={formData.notes} onChange={set('notes')} multiline />
        <FormButtons onCancel={onClose} />
      </form>
    </Modal>
  );
}

// ============ RACK MODAL (Power in Amps, AC/DC) ============

function RackModal({ rack, sites, onSave, onClose }) {
  const [formData, setFormData] = useState(rack || {
    id: '', name: '', siteId: '', height: 42,
    hasAC: false, hasDC: false,
    purchasedPowerAC: '', purchasedPowerDC: '',
    voltageAC: '208', voltageDC: '-48',
    pduCount: '', manufacturer: '', model: '', notes: ''
  });

  const set = (field) => (value) => setFormData(prev => ({ ...prev, [field]: value }));

  const handleSubmit = (e) => {
    e.preventDefault();
    onSave({ ...formData, id: formData.id || 'rack-' + Date.now(), height: parseInt(formData.height) || 42 });
  };

  return (
    <Modal title={rack ? 'Edit Rack' : 'Add New Rack'} onClose={onClose}>
      <form onSubmit={handleSubmit}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 1rem' }}>
          <FormField label="Rack Name" value={formData.name} onChange={set('name')} required placeholder="e.g., RK-01" />
          <FormField label="Site" type="select" value={formData.siteId} onChange={set('siteId')} required
            options={sites.map(s => ({ value: s.id, label: s.name }))} />
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0 1rem' }}>
          <FormField label="Height (RU)" type="number" value={formData.height} onChange={set('height')} placeholder="42" />
          <FormField label="Manufacturer" value={formData.manufacturer} onChange={set('manufacturer')} />
          <FormField label="Model" value={formData.model} onChange={set('model')} />
        </div>
        <SectionHeader title="Power Configuration" color="#ff6b9d" />
        <div style={{ marginBottom: '1rem' }}>
          <label style={{ display: 'block', marginBottom: '0.5rem', fontSize: '0.8rem', color: '#6b8299', fontWeight: 500 }}>
            Available Power Types
          </label>
          <div style={{ display: 'flex', gap: '1.5rem' }}>
            <CheckboxField label="AC Power" checked={formData.hasAC} onChange={set('hasAC')} />
            <CheckboxField label="DC Power (-48V)" checked={formData.hasDC} onChange={set('hasDC')} />
          </div>
        </div>
        {formData.hasAC ? (
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 1rem' }}>
            <FormField label="AC Purchased Power (Amps)" type="number" value={formData.purchasedPowerAC} onChange={set('purchasedPowerAC')} placeholder="e.g., 30" />
            <FormField label="AC Voltage" type="select" value={formData.voltageAC} onChange={set('voltageAC')}
              options={[
                { value: '120', label: '120V' },
                { value: '208', label: '208V' },
                { value: '240', label: '240V' }
              ]} />
          </div>
        ) : null}
        {formData.hasDC ? (
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 1rem' }}>
            <FormField label="DC Purchased Power (Amps)" type="number" value={formData.purchasedPowerDC} onChange={set('purchasedPowerDC')} placeholder="e.g., 100" />
            <FormField label="DC Voltage" value={formData.voltageDC} onChange={set('voltageDC')} placeholder="-48V" />
          </div>
        ) : null}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 1rem' }}>
          <FormField label="PDU Count" type="number" value={formData.pduCount} onChange={set('pduCount')} />
          <div></div>
        </div>
        <FormField label="Notes" value={formData.notes} onChange={set('notes')} multiline />
        <FormButtons onCancel={onClose} />
      </form>
    </Modal>
  );
}

// ============ EQUIPMENT TEMPLATE MODAL ============

function TemplateModal({ template, onSave, onClose }) {
  const [formData, setFormData] = useState(template || {
    id: '', name: '', manufacturer: '', model: '', partNumber: '', type: 'router',
    rackUnits: 1, powerDraw: '', maxPowerDraw: '', powerType: 'AC',
    portCount: '', interfaceTypes: '', notes: ''
  });

  const set = (field) => (value) => setFormData(prev => ({ ...prev, [field]: value }));

  const handleSubmit = (e) => {
    e.preventDefault();
    onSave({ ...formData, id: formData.id || 'tmpl-' + Date.now() });
  };

  return (
    <Modal title={template ? 'Edit Equipment Template' : 'New Equipment Template'} onClose={onClose}>
      <form onSubmit={handleSubmit}>
        <div style={{ padding: '0.75rem 1rem', background: '#0a2a1e', border: '1px solid #00ff9f40', borderRadius: '8px', marginBottom: '1.25rem', fontSize: '0.8rem', color: '#8fd9bb' }}>
          Enter specs once for a part number. When adding equipment, pick this template and everything auto-fills.
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 1rem' }}>
          <FormField label="Template Name" value={formData.name} onChange={set('name')} required placeholder="e.g., Cisco ASR-9010" />
          <FormField label="Part Number" value={formData.partNumber} onChange={set('partNumber')} placeholder="PN for ordering" />
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0 1rem' }}>
          <FormField label="Manufacturer" value={formData.manufacturer} onChange={set('manufacturer')} required />
          <FormField label="Model" value={formData.model} onChange={set('model')} required />
          <FormField label="Type" type="select" value={formData.type} onChange={set('type')}
            options={[
              { value: 'router', label: 'Router' },
              { value: 'switch', label: 'Switch' },
              { value: 'dwdm', label: 'DWDM / Optical' },
              { value: 'server', label: 'Server' },
              { value: 'firewall', label: 'Firewall' },
              { value: 'pdu', label: 'PDU' },
              { value: 'patch-panel', label: 'Patch Panel' },
              { value: 'other', label: 'Other' }
            ]} />
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: '0 1rem' }}>
          <FormField label="Rack Units" type="number" value={formData.rackUnits} onChange={set('rackUnits')} />
          <FormField label="Typical Draw (W)" type="number" value={formData.powerDraw} onChange={set('powerDraw')} />
          <FormField label="Max Draw (W)" type="number" value={formData.maxPowerDraw} onChange={set('maxPowerDraw')} />
          <FormField label="Power Type" type="select" value={formData.powerType} onChange={set('powerType')}
            options={[
              { value: 'AC', label: 'AC' },
              { value: 'DC', label: 'DC' },
              { value: 'AC/DC', label: 'AC or DC' }
            ]} />
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: '0 1rem' }}>
          <FormField label="Port Count" type="number" value={formData.portCount} onChange={set('portCount')} />
          <FormField label="Interface Types" value={formData.interfaceTypes} onChange={set('interfaceTypes')} placeholder="e.g., 48x 10G SFP+, 4x 100G QSFP28" />
        </div>
        <FormField label="Notes" value={formData.notes} onChange={set('notes')} multiline />
        <FormButtons onCancel={onClose} saveLabel="Save Template" />
      </form>
    </Modal>
  );
}

// ============ EQUIPMENT MODAL (with template auto-fill) ============

function EquipmentModal({ equip, racks, templates, onSave, onClose }) {
  const [formData, setFormData] = useState(equip || {
    id: '', name: '', templateId: '', manufacturer: '', model: '', type: 'router',
    serialNumber: '', assetTag: '', rackId: '', startRU: '', rackUnits: 1,
    powerDraw: '', maxPowerDraw: '', powerType: 'AC',
    portCount: '', interfaceTypes: '', managementIP: '', notes: ''
  });

  const set = (field) => (value) => setFormData(prev => ({ ...prev, [field]: value }));

  const applyTemplate = (templateId) => {
    const t = templates.find(x => x.id === templateId);
    if (t) {
      setFormData(prev => ({
        ...prev,
        templateId: templateId,
        manufacturer: t.manufacturer,
        model: t.model,
        type: t.type,
        rackUnits: t.rackUnits,
        powerDraw: t.powerDraw,
        maxPowerDraw: t.maxPowerDraw,
        powerType: t.powerType,
        portCount: t.portCount,
        interfaceTypes: t.interfaceTypes
      }));
    } else {
      setFormData(prev => ({ ...prev, templateId: '' }));
    }
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    onSave({ ...formData, id: formData.id || 'eq-' + Date.now() });
  };

  return (
    <Modal title={equip ? 'Edit Equipment' : 'Add Equipment'} onClose={onClose}>
      <form onSubmit={handleSubmit}>
        <div style={{ padding: '1rem', background: '#1a1f2e', border: '1px solid #2a3441', borderRadius: '8px', marginBottom: '1.25rem' }}>
          <label style={{ display: 'block', marginBottom: '0.4rem', fontSize: '0.8rem', color: '#00ff9f', fontWeight: 600 }}>
            Use Equipment Template (auto-fills specs)
          </label>
          <select value={formData.templateId ?? ''} onChange={(e) => applyTemplate(e.target.value)}
            style={{ width: '100%', padding: '0.6rem 0.875rem', background: '#0a0e14', border: '1px solid #2a3441', borderRadius: '8px', color: '#c5d1de', fontSize: '0.875rem' }}>
            <option value="">-- No template / manual entry --</option>
            {templates.map(t => (
              <option key={t.id} value={t.id}>{t.manufacturer} {t.model} ({t.type})</option>
            ))}
          </select>
          {templates.length === 0 ? (
            <div style={{ marginTop: '0.5rem', fontSize: '0.72rem', color: '#6b8299' }}>
              No templates yet — create them under Equipment → Templates tab.
            </div>
          ) : null}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 1rem' }}>
          <FormField label="Device Name" value={formData.name} onChange={set('name')} required placeholder="e.g., DNV-CORE-RTR-01" />
          <FormField label="Serial Number" value={formData.serialNumber} onChange={set('serialNumber')} />
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0 1rem' }}>
          <FormField label="Manufacturer" value={formData.manufacturer} onChange={set('manufacturer')} />
          <FormField label="Model" value={formData.model} onChange={set('model')} />
          <FormField label="Type" type="select" value={formData.type} onChange={set('type')}
            options={[
              { value: 'router', label: 'Router' },
              { value: 'switch', label: 'Switch' },
              { value: 'dwdm', label: 'DWDM / Optical' },
              { value: 'server', label: 'Server' },
              { value: 'firewall', label: 'Firewall' },
              { value: 'pdu', label: 'PDU' },
              { value: 'patch-panel', label: 'Patch Panel' },
              { value: 'other', label: 'Other' }
            ]} />
        </div>
        <SectionHeader title="Rack Placement" color="#00d4ff" />
        <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 1fr', gap: '0 1rem' }}>
          <FormField label="Rack" type="select" value={formData.rackId} onChange={set('rackId')}
            options={racks.map(r => ({ value: r.id, label: r.name }))} />
          <FormField label="Start RU" type="number" value={formData.startRU} onChange={set('startRU')} />
          <FormField label="Height (RU)" type="number" value={formData.rackUnits} onChange={set('rackUnits')} />
        </div>
        <SectionHeader title="Power & Network" color="#ffd700" />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0 1rem' }}>
          <FormField label="Typical Draw (W)" type="number" value={formData.powerDraw} onChange={set('powerDraw')} />
          <FormField label="Max Draw (W)" type="number" value={formData.maxPowerDraw} onChange={set('maxPowerDraw')} />
          <FormField label="Power Type" type="select" value={formData.powerType} onChange={set('powerType')}
            options={[
              { value: 'AC', label: 'AC' },
              { value: 'DC', label: 'DC' },
              { value: 'AC/DC', label: 'AC or DC' }
            ]} />
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0 1rem' }}>
          <FormField label="Port Count" type="number" value={formData.portCount} onChange={set('portCount')} />
          <FormField label="Interface Types" value={formData.interfaceTypes} onChange={set('interfaceTypes')} />
          <FormField label="Management IP" value={formData.managementIP} onChange={set('managementIP')} />
        </div>
        <FormField label="Asset Tag" value={formData.assetTag} onChange={set('assetTag')} />
        <FormField label="Notes" value={formData.notes} onChange={set('notes')} multiline />
        <FormButtons onCancel={onClose} />
      </form>
    </Modal>
  );
}

// ============ FDP MODAL (conditional rack selector) ============

function FDPModal({ fdp, sites, racks, onSave, onClose }) {
  const [formData, setFormData] = useState(fdp || {
    id: '', name: '', siteId: '', mountingType: 'rack', rackId: '', startRU: '',
    portCount: '', connectorType: 'LC', fiberType: 'single-mode', notes: ''
  });

  const set = (field) => (value) => setFormData(prev => ({ ...prev, [field]: value }));

  const siteRacks = racks.filter(r => !formData.siteId || r.siteId === formData.siteId);

  const handleSubmit = (e) => {
    e.preventDefault();
    onSave({ ...formData, id: formData.id || 'fdp-' + Date.now() });
  };

  return (
    <Modal title={fdp ? 'Edit FDP' : 'Add FDP'} onClose={onClose}>
      <form onSubmit={handleSubmit}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 1rem' }}>
          <FormField label="FDP Name" value={formData.name} onChange={set('name')} required placeholder="e.g., FDP-A-01" />
          <FormField label="Site" type="select" value={formData.siteId} onChange={set('siteId')} required
            options={sites.map(s => ({ value: s.id, label: s.name }))} />
        </div>
        <FormField label="Mounting Type" type="select" value={formData.mountingType} onChange={set('mountingType')}

// ============ CIRCUIT MODAL ============
// Provider/Customer + Iris position + On-net/Off-net + multi-location

function CircuitModal({ circuit, sites, fdps, onSave, onClose }) {
  const [formData, setFormData] = useState(circuit || {
    id: '', circuitId: '',
    direction: 'provider',
    irisPosition: '',
    networkType: 'on-net',
    additionalLocations: [],
    carrier: '', circuitType: 'lit-fiber', bandwidth: '',
    aEndSiteId: '', aEndFdpId: '', aEndPort: '',
    zEndSiteId: '', zEndFdpId: '', zEndPort: '',
    orderNumber: '', monthlyCost: '', installDate: '', contractEndDate: '',
    status: 'active', notes: ''
  });

  const set = (field) => (value) => setFormData(prev => ({ ...prev, [field]: value }));

  const addLocation = () => {
    const letters = 'BCDEFGHIJKLMNOPQRSTUVWXY';
    const used = formData.additionalLocations.map(l => l.letter);
    const nextLetter = letters.split('').find(l => used.indexOf(l) === -1) || 'B';
    setFormData(prev => ({
      ...prev,
      additionalLocations: [...prev.additionalLocations, { letter: nextLetter, location: '', fdpId: '', port: '' }]
    }));
  };

  const removeLocation = (index) => {
    setFormData(prev => ({
      ...prev,
      additionalLocations: prev.additionalLocations.filter((_, i) => i !== index)
    }));
  };

  const updateLocation = (index, field, value) => {
    setFormData(prev => {
      const updated = prev.additionalLocations.map((loc, i) => i === index ? { ...loc, [field]: value } : loc);
      return { ...prev, additionalLocations: updated };
    });
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    onSave({ ...formData, id: formData.id || 'ckt-' + Date.now() });
  };

  return (
    <Modal title={circuit ? 'Edit Circuit' : 'Add Circuit'} onClose={onClose}>
      <form onSubmit={handleSubmit}>
        <RadioCards
          label="Circuit Direction (Iris Position)"
          value={formData.direction}
          onChange={set('direction')}
          optionA={{ value: 'provider', title: 'Provider Circuit', desc: 'We purchase this circuit' }}
          optionB={{ value: 'customer', title: 'Customer Circuit', desc: 'We provide this circuit' }}
        />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 1rem' }}>
          <FormField label="Circuit ID" value={formData.circuitId} onChange={set('circuitId')} required placeholder="e.g., CKT-2026-0142" />
          <FormField label="Iris Position" value={formData.irisPosition} onChange={set('irisPosition')} placeholder="e.g., IRU-123, Pos-A4" />
        </div>
        <RadioCards
          label="Network Type"
          value={formData.networkType}
          onChange={(v) => setFormData(prev => ({ ...prev, networkType: v, additionalLocations: v === 'on-net' ? [] : prev.additionalLocations }))}
          optionA={{ value: 'on-net', title: 'On-Net', desc: 'Direct A-to-Z on our network' }}
          optionB={{ value: 'off-net', title: 'Off-Net (Type II)', desc: 'Multi-location A → B → C → Z' }}
        />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0 1rem' }}>
          <FormField label="Carrier / Provider" value={formData.carrier} onChange={set('carrier')} placeholder={formData.direction === 'provider' ? 'Who we buy from' : 'Customer name'} />
          <FormField label="Circuit Type" type="select" value={formData.circuitType} onChange={set('circuitType')}
            options={[
              { value: 'lit-fiber', label: 'Lit Fiber' },
              { value: 'dark-fiber', label: 'Dark Fiber' },
              { value: 'wavelength', label: 'Wavelength' },
              { value: 'ethernet', label: 'Ethernet' },
              { value: 'dwdm', label: 'DWDM Channel' }
            ]} />
          <FormField label="Bandwidth" value={formData.bandwidth} onChange={set('bandwidth')} placeholder="e.g., 10G, 100G" />
        </div>
        <SectionHeader title="A Location (Origin)" color="#00ff9f" />
        <div style={{ display: 'grid', gridTemplateColumns: '2fr 2fr 1fr', gap: '0 1rem' }}>
          <FormField label="A-End Site" type="select" value={formData.aEndSiteId} onChange={set('aEndSiteId')}
            options={sites.map(s => ({ value: s.id, label: s.name }))} />
          <FormField label="A-End FDP" type="select" value={formData.aEndFdpId} onChange={set('aEndFdpId')}
            options={fdps.map(f => ({ value: f.id, label: f.name }))} />
          <FormField label="Port" value={formData.aEndPort} onChange={set('aEndPort')} />
        </div>
        {formData.networkType === 'off-net' ? (
          <div style={{ marginTop: '0.5rem', marginBottom: '1rem' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.75rem' }}>
              <h4 style={{ fontSize: '0.85rem', fontWeight: 600, color: '#00d4ff', margin: 0 }}>
                Intermediate Locations (B, C, D...)
              </h4>
              <button type="button" onClick={addLocation}
                style={{ padding: '0.45rem 0.9rem', background: '#00d4ff', border: 'none', borderRadius: '6px', color: '#0a0e14', fontSize: '0.75rem', fontWeight: 700, cursor: 'pointer' }}>
                + Add Location
              </button>
            </div>
            {formData.additionalLocations.length === 0 ? (
              <div style={{ padding: '1.25rem', textAlign: 'center', background: '#0a0e14', border: '1px dashed #2a3441', borderRadius: '8px', color: '#6b8299', fontSize: '0.8rem' }}>
                Off-net circuit — click "+ Add Location" for each intermediate handoff (B, C, D...)
              </div>
            ) : null}
            {formData.additionalLocations.map((loc, index) => (
              <div key={index} style={{ background: '#0a1a2a', border: '1px solid #00d4ff40', borderRadius: '8px', padding: '0.9rem', marginBottom: '0.75rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.6rem' }}>
                  <span style={{ fontSize: '0.85rem', fontWeight: 700, color: '#00d4ff' }}>{loc.letter} Location</span>
                  <button type="button" onClick={() => removeLocation(index)}
                    style={{ padding: '0.25rem 0.6rem', background: '#ff6b9d', border: 'none', borderRadius: '4px', color: '#fff', fontSize: '0.7rem', cursor: 'pointer' }}>
                    Remove
                  </button>
                </div>
                <FormField label="Location Name / Address" value={loc.location} onChange={(v) => updateLocation(index, 'location', v)} placeholder="Site, carrier hotel, or address" />
                <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: '0 1rem' }}>
                  <FormField label="FDP (if ours)" type="select" value={loc.fdpId} onChange={(v) => updateLocation(index, 'fdpId', v)}
                    options={fdps.map(f => ({ value: f.id, label: f.name }))} />
                  <FormField label="Port / Handoff" value={loc.port} onChange={(v) => updateLocation(index, 'port', v)} />
                </div>
              </div>
            ))}
          </div>
        ) : null}
        <SectionHeader title="Z Location (Terminus)" color="#ff6b9d" />
        <div style={{ display: 'grid', gridTemplateColumns: '2fr 2fr 1fr', gap: '0 1rem' }}>
          <FormField label="Z-End Site" type="select" value={formData.zEndSiteId} onChange={set('zEndSiteId')}
            options={sites.map(s => ({ value: s.id, label: s.name }))} />
          <FormField label="Z-End FDP" type="select" value={formData.zEndFdpId} onChange={set('zEndFdpId')}
            options={fdps.map(f => ({ value: f.id, label: f.name }))} />
          <FormField label="Port" value={formData.zEndPort} onChange={set('zEndPort')} />
        </div>
        <SectionHeader title="Order & Billing" color="#ffd700" />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: '0 1rem' }}>
          <FormField label="Order Number" value={formData.orderNumber} onChange={set('orderNumber')} />
          <FormField label="Monthly Cost ($)" type="number" value={formData.monthlyCost} onChange={set('monthlyCost')} />
          <FormField label="Install Date" type="date" value={formData.installDate} onChange={set('installDate')} />
          <FormField label="Contract End" type="date" value={formData.contractEndDate} onChange={set('contractEndDate')} />
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: '0 1rem' }}>
          <FormField label="Status" type="select" value={formData.status} onChange={set('status')}
            options={[
              { value: 'active', label: 'Active' },
              { value: 'pending', label: 'Pending Install' },
              { value: 'ordered', label: 'Ordered' },
              { value: 'disconnected', label: 'Disconnected' }
            ]} />
          <div></div>
        </div>
        <FormField label="Notes" value={formData.notes} onChange={set('notes')} multiline />
        <FormButtons onCancel={onClose} />
      </form>
    </Modal>
  );
}

// ============ MAIN APP ============

function NetworkInventorySystem() {
  const [activeView, setActiveView] = useState('dashboard');
  const [equipTab, setEquipTab] = useState('inventory');
  const [sites, setSites] = useState([]);
  const [racks, setRacks] = useState([]);
  const [equipment, setEquipment] = useState([]);
  const [templates, setTemplates] = useState([]);
  const [fdps, setFdps] = useState([]);
  const [circuits, setCircuits] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null);       // which modal is open
  const [editItem, setEditItem] = useState(null); // item being edited

  // ---- history-based navigation so browser Back works ----
  const navigateTo = (view) => {
    setActiveView(view);
    try { window.history.pushState({ view: view }, '', '#' + view); } catch (err) {}
  };

  useEffect(() => {
    const onPop = (e) => {
      const v = (e.state && e.state.view) || (window.location.hash || '#dashboard').replace('#', '') || 'dashboard';
      setActiveView(v);
      setModal(null);
      setEditItem(null);
    };
    window.addEventListener('popstate', onPop);
    const initial = (window.location.hash || '').replace('#', '');
    if (initial) setActiveView(initial);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  useEffect(() => { loadAll(); }, []);

  const loadAll = async () => {
    setLoading(true);
    const [s, r, e, t, f, c] = await Promise.all([
      storage.get('sites'), storage.get('racks'), storage.get('equipment'),
      storage.get('equipmentTemplates'), storage.get('fdps'), storage.get('circuits')
    ]);
    setSites(s || []); setRacks(r || []); setEquipment(e || []);
    setTemplates(t || []); setFdps(f || []); setCircuits(c || []);
    setLoading(false);
  };

  const persist = {
    sites: async (v) => { setSites(v); await storage.set('sites', v); },
    racks: async (v) => { setRacks(v); await storage.set('racks', v); },
    equipment: async (v) => { setEquipment(v); await storage.set('equipment', v); },
    templates: async (v) => { setTemplates(v); await storage.set('equipmentTemplates', v); },
    fdps: async (v) => { setFdps(v); await storage.set('fdps', v); },
    circuits: async (v) => { setCircuits(v); await storage.set('circuits', v); }
  };

  const closeModal = () => { setModal(null); setEditItem(null); };

  const upsert = (list, item) => {
    const idx = list.findIndex(x => x.id === item.id);
    if (idx >= 0) {
      return list.map(x => x.id === item.id ? item : x);
    }
    return [...list, item];
  };

  const confirmDelete = (kind, item, listKey) => {
    if (window.confirm('Delete "' + (item.name || item.circuitId || item.id) + '"? This cannot be undone.')) {
      const map = { sites: sites, racks: racks, equipment: equipment, templates: templates, fdps: fdps, circuits: circuits };
      persist[listKey](map[listKey].filter(x => x.id !== item.id));
    }
  };

  const siteName = (id) => (sites.find(s => s.id === id) || {}).name || '—';
  const rackName = (id) => (racks.find(r => r.id === id) || {}).name || '—';

  const exportData = () => {
    const data = { sites: sites, racks: racks, equipment: equipment, equipmentTemplates: templates, fdps: fdps, circuits: circuits, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'netinventory-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  };

  if (loading) {
    return (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', background: '#0a0e14', color: '#00ff9f', fontFamily: '"JetBrains Mono", monospace' }}>
        Loading NetInventory v3.0...
      </div>
    );
  }

  const navItems = [
    { id: 'dashboard', label: 'Dashboard' },
    { id: 'sites', label: 'Sites' },
    { id: 'racks', label: 'Racks' },
    { id: 'equipment', label: 'Equipment' },
    { id: 'fdps', label: 'FDPs' },
    { id: 'circuits', label: 'Circuits' }
  ];

  return (
    <div style={{ minHeight: '100vh', background: '#0a0e14', color: '#c5d1de', fontFamily: '"Inter", -apple-system, sans-serif' }}>
      <header style={{ background: 'linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%)', borderBottom: '1px solid #1e2936', padding: '1rem 2rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div>
          <h1 style={{ margin: 0, fontSize: '1.4rem', fontWeight: 700, background: 'linear-gradient(135deg, #00ff9f 0%, #00d4ff 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
            NetInventory v3.0
          </h1>
          <p style={{ margin: 0, fontSize: '0.7rem', color: '#6b8299', letterSpacing: '0.08em' }}>MIDDLE MILE INFRASTRUCTURE</p>
        </div>
        <button onClick={exportData}
          style={{ padding: '0.5rem 1rem', background: '#1a1f2e', border: '1px solid #2a3441', borderRadius: '8px', color: '#6b8299', fontSize: '0.8rem', cursor: 'pointer' }}>
          ⬇ Export Backup
        </button>
      </header>

      <div style={{ display: 'flex' }}>
        <nav style={{ width: '220px', background: '#0f1419', borderRight: '1px solid #1e2936', minHeight: 'calc(100vh - 69px)', padding: '1.25rem 0' }}>
          {navItems.map(item => (
            <button key={item.id} onClick={() => navigateTo(item.id)}
              style={{
                width: '100%', padding: '0.7rem 1.5rem', background: activeView === item.id ? 'rgba(0,255,159,0.08)' : 'transparent',
                border: 'none', borderLeft: '3px solid ' + (activeView === item.id ? '#00ff9f' : 'transparent'),
                color: activeView === item.id ? '#00ff9f' : '#6b8299', fontSize: '0.875rem',
                fontWeight: activeView === item.id ? 600 : 400, cursor: 'pointer', textAlign: 'left'
              }}>
              {item.label}
            </button>
          ))}
        </nav>

        <main style={{ flex: 1, padding: '2rem', maxWidth: 'calc(100vw - 220px)' }}>
          {activeView === 'dashboard' ? (
            <div>
              <h2 style={{ fontSize: '1.35rem', fontWeight: 700, color: '#fff', marginTop: 0 }}>Dashboard</h2>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(170px, 1fr))', gap: '1rem' }}>
                <StatCard label="Sites" value={sites.length} color="#00ff9f" />
                <StatCard label="Racks" value={racks.length} color="#00d4ff" />
                <StatCard label="Equipment" value={equipment.length} color="#ff6b9d" />
                <StatCard label="FDPs" value={fdps.length} color="#a78bfa" />
                <StatCard label="Circuits" value={circuits.length} color="#ffd700" />
                <StatCard label="Provider Ckts" value={circuits.filter(c => c.direction === 'provider').length} color="#00ff9f" />
                <StatCard label="Customer Ckts" value={circuits.filter(c => c.direction === 'customer').length} color="#00d4ff" />
                <StatCard label="Off-Net Ckts" value={circuits.filter(c => c.networkType === 'off-net').length} color="#ff9f00" />
              </div>
              <div style={{ marginTop: '2rem', padding: '1.25rem', background: '#0f1419', border: '1px solid #1e2936', borderRadius: '12px', fontSize: '0.85rem', color: '#6b8299', lineHeight: 1.7 }}>
                <strong style={{ color: '#c5d1de' }}>Quick start:</strong> Add Sites first, then Racks at those sites, then Equipment into racks.
                Create Equipment Templates once per part number so specs auto-fill. FDPs can be rack-mounted (pick the rack) or wall/floor.
                Circuits track Provider vs Customer, Iris position, and Off-Net (Type II) intermediate locations.
              </div>
            </div>
          ) : null}

          {activeView === 'sites' ? (
            <ListView title="Sites & Locations" addLabel="Add Site" items={sites}
              columns={[
                { key: 'name', label: 'Name' },
                { key: 'clli', label: 'CLLI' },
                { key: 'siteType', label: 'Type' },
                { key: 'city', label: 'City', render: (s) => s.city ? s.city + (s.state ? ', ' + s.state : '') : '—' }

              onAdd={() => { setEditItem(null); setModal('site'); }}
              onEdit={(item) => { setEditItem(item); setModal('site'); }}
              onDelete={(item) => confirmDelete('site', item, 'sites')}
            />
          ) : null}

          {activeView === 'racks' ? (
            <ListView title="Racks" addLabel="Add Rack" items={racks}
              columns={[

                { key: 'siteId', label: 'Site', render: (r) => siteName(r.siteId) },

                { key: 'power', label: 'Power', render: (r) => {

                    if (r.hasAC && r.purchasedPowerAC) parts.push(r.purchasedPowerAC + 'A AC');
                    if (r.hasDC && r.purchasedPowerDC) parts.push(r.purchasedPowerDC + 'A DC');
                    return parts.length ? parts.join(' + ') : '—';
                  } }
              ]}
              onAdd={() => { setEditItem(null); setModal('rack'); }}
              onEdit={(item) => { setEditItem(item); setModal('rack'); }}
              onDelete={(item) => confirmDelete('rack', item, 'racks')}
              emptyHint={sites.length === 0 ? 'Add a Site first — racks live at sites.' : 'No racks yet. Add your first rack.'}
            />
          ) : null}

          {activeView === 'equipment' ? (
            <div>
              <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1.25rem' }}>
                <button onClick={() => setEquipTab('inventory')}
                  style={{ padding: '0.5rem 1.1rem', background: equipTab === 'inventory' ? '#00ff9f' : '#1a1f2e', border: '1px solid #2a3441', borderRadius: '8px', color: equipTab === 'inventory' ? '#0a0e14' : '#6b8299', fontSize: '0.8rem', fontWeight: 600, cursor: 'pointer' }}>
                  Inventory ({equipment.length})
                </button>
                <button onClick={() => setEquipTab('templates')}
                  style={{ padding: '0.5rem 1.1rem', background: equipTab === 'templates' ? '#00ff9f' : '#1a1f2e', border: '1px solid #2a3441', borderRadius: '8px', color: equipTab === 'templates' ? '#0a0e14' : '#6b8299', fontSize: '0.8rem', fontWeight: 600, cursor: 'pointer' }}>
                  Templates ({templates.length})
                </button>
              </div>
              {equipTab === 'inventory' ? (
                <ListView title="Equipment" addLabel="Add Equipment" items={equipment}
                  columns={[
                    { key: 'name', label: 'Name' },
                    { key: 'model', label: 'Make/Model', render: (e) => ((e.manufacturer || '') + ' ' + (e.model || '')).trim() || '—' },
                    { key: 'type', label: 'Type' },
                    { key: 'rackId', label: 'Rack', render: (e) => rackName(e.rackId) },
                    { key: 'startRU', label: 'RU', render: (e) => e.startRU ? 'RU ' + e.startRU : '—' },
                    { key: 'serialNumber', label: 'Serial' }
                  ]}
                  onAdd={() => { setEditItem(null); setModal('equipment'); }}
                  onEdit={(item) => { setEditItem(item); setModal('equipment'); }}
                  onDelete={(item) => confirmDelete('equipment', item, 'equipment')}
                  emptyHint={racks.length === 0 ? 'Add a Rack first — equipment mounts in racks.' : 'No equipment yet.'}
                />
              ) : (
                <ListView title="Equipment Templates" addLabel="New Template" items={templates}
                  columns={[
                    { key: 'name', label: 'Template' },
                    { key: 'partNumber', label: 'Part #' },
                    { key: 'type', label: 'Type' },
                    { key: 'rackUnits', label: 'Size', render: (t) => (t.rackUnits || 1) + 'U' },
                    { key: 'powerDraw', label: 'Power', render: (t) => t.powerDraw ? t.powerDraw + 'W ' + (t.powerType || '') : '—' }
                  ]}
                  onAdd={() => { setEditItem(null); setModal('template'); }}
                  onEdit={(item) => { setEditItem(item); setModal('template'); }}
                  onDelete={(item) => confirmDelete('template', item, 'templates')}
                  emptyHint="Create a template per part number — specs auto-fill when adding equipment."
                />
              )}
            </div>
          ) : null}

          {activeView === 'fdps' ? (
            <ListView title="Fiber Distribution Panels" addLabel="Add FDP" items={fdps}
              columns={[
                { key: 'name', label: 'Name' },
                { key: 'siteId', label: 'Site', render: (f) => siteName(f.siteId) },
                { key: 'mountingType', label: 'Mounting', render: (f) => f.mountingType === 'rack' ? 'Rack: ' + rackName(f.rackId) : (f.mountingType || '—') },
                { key: 'portCount', label: 'Ports' },
                { key: 'connectorType', label: 'Connector' }
              ]}
              onAdd={() => { setEditItem(null); setModal('fdp'); }}
              onEdit={(item) => { setEditItem(item); setModal('fdp'); }}
              onDelete={(item) => confirmDelete('fdp', item, 'fdps')}
              emptyHint={sites.length === 0 ? 'Add a Site first.' : 'No FDPs yet.'}
            />
          ) : null}

          {activeView === 'circuits' ? (
            <ListView title="Circuits" addLabel="Add Circuit" items={circuits}
              columns={[
                { key: 'circuitId', label: 'Circuit ID' },
                { key: 'direction', label: 'Direction', render: (c) => (
                    <span style={{ padding: '0.2rem 0.55rem', borderRadius: '4px', fontSize: '0.72rem', fontWeight: 700, background: c.direction === 'provider' ? '#00ff9f20' : '#00d4ff20', color: c.direction === 'provider' ? '#00ff9f' : '#00d4ff' }}>
                      {c.direction === 'provider' ? 'PROVIDER' : 'CUSTOMER'}
                    </span>
                  ) },
                { key: 'networkType', label: 'Net Type', render: (c) => (
                    <span style={{ color: c.networkType === 'off-net' ? '#ff9f00' : '#c5d1de' }}>
                      {c.networkType === 'off-net' ? 'Off-Net (' + ((c.additionalLocations || []).length + 2) + ' locs)' : 'On-Net'}
                    </span>
                  ) },
                { key: 'irisPosition', label: 'Iris Pos' },
                { key: 'bandwidth', label: 'BW' },
                { key: 'route', label: 'Route', render: (c) => {
                    const a = siteName(c.aEndSiteId);
                    const z = siteName(c.zEndSiteId);
                    const mids = (c.additionalLocations || []).map(l => l.letter).join('→');
                    return a + (mids ? ' → ' + mids + ' → ' : ' → ') + z;
                  } },
                { key: 'status', label: 'Status' }
              ]}
              onAdd={() => { setEditItem(null); setModal('circuit'); }}
              onEdit={(item) => { setEditItem(item); setModal('circuit'); }}
              onDelete={(item) => confirmDelete('circuit', item, 'circuits')}
            />
          ) : null}
        </main>
      </div>

      {modal === 'site' ? (
        <SiteModal site={editItem} onClose={closeModal}
          onSave={(item) => { persist.sites(upsert(sites, item)); closeModal(); }} />
      ) : null}
      {modal === 'rack' ? (
        <RackModal rack={editItem} sites={sites} onClose={closeModal}
          onSave={(item) => { persist.racks(upsert(racks, item)); closeModal(); }} />
      ) : null}
      {modal === 'equipment' ? (
        <EquipmentModal equip={editItem} racks={racks} templates={templates} onClose={closeModal}
          onSave={(item) => { persist.equipment(upsert(equipment, item)); closeModal(); }} />
      ) : null}
      {modal === 'template' ? (
        <TemplateModal template={editItem} onClose={closeModal}
          onSave={(item) => { persist.templates(upsert(templates, item)); closeModal(); }} />
      ) : null}
      {modal === 'fdp' ? (
        <FDPModal fdp={editItem} sites={sites} racks={racks} onClose={closeModal}
          onSave={(item) => { persist.fdps(upsert(fdps, item)); closeModal(); }} />
      ) : null}
      {modal === 'circuit' ? (
        <CircuitModal circuit={editItem} sites={sites} fdps={fdps} onClose={closeModal}
          onSave={(item) => { persist.circuits(upsert(circuits, item)); closeModal(); }} />
      ) : null}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<NetworkInventorySystem />);

  </script>
</body>
</html>
